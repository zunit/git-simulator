<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitIgnore & Atomic Commits Simulator</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    height: 100vh;
    margin: 0;
    background-color: #1e1e1e;
    color: #fff;
  }
  #terminal-container {
    flex: 2;
    background-color: #121212;
    padding: 20px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 16px;
    overflow-y: auto;
    position: relative;
  }
  #guide-container {
    flex: 1;
    background-color: #252526;
    padding: 30px;
    border-left: 2px solid #333;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .prompt { color: #4af626; }
  .command-input {
    background: transparent;
    border: none;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    font-size: 16px;
    outline: none;
    width: 70%;
  }
  .output { color: #ccc; margin-bottom: 10px; white-space: pre-wrap; line-height: 1.4; }
  .untracked { color: #ff5252; }
  .staged { color: #4af626; }
  
  /* Vim Styles */
  #vim-ui {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #121212;
    padding: 20px;
    flex-direction: column;
    z-index: 10;
  }
  #vim-text {
    flex-grow: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    font-size: 16px;
    outline: none;
    resize: none;
  }
  #vim-status-bar {
    display: flex;
    justify-content: space-between;
    height: 20px;
    font-weight: bold;
  }
  #vim-mode { color: #4af626; }
  #vim-command { color: #fff; }

  .popup-card {
    background: #333;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  .popup-card h2 { margin-top: 0; color: #4af626; }
  .popup-card h3 { color: #ffca28; margin-bottom: 5px;}
  .highlight { color: #ffca28; font-weight: bold; }
  .danger { color: #ff5252; font-weight: bold; }
  .code-block { background: #222; padding: 10px; border-radius: 4px; font-family: monospace; color: #e0e0e0; margin: 10px 0;}
</style>
</head>
<body>

<div id="terminal-container">
  <div id="history">
    <div class="output">Repository initialized. Working directory contains project code and sensitive config files.</div>
  </div>
  <div id="input-line">
    <span class="prompt">user@machine:~/my-secure-project$</span>
    <input type="text" id="cmd" class="command-input" autocomplete="off" autofocus>
  </div>

  <div id="vim-ui">
    <textarea id="vim-text" readonly></textarea>
    <div id="vim-status-bar">
      <span id="vim-mode">".gitignore" [New File]</span>
      <span id="vim-command"></span>
    </div>
  </div>
</div>

<div id="guide-container">
  <div class="popup-card" id="guide-card">
    <h2>Step 1: The Setup</h2>
    <p>Let's check what is currently sitting in our working directory.</p>
    <p>Type:</p>
    <p class="highlight">git status</p>
  </div>
</div>

<script>
  const cmdInput = document.getElementById('cmd');
  const historyDiv = document.getElementById('history');
  const guideCard = document.getElementById('guide-card');
  const terminalContainer = document.getElementById('terminal-container');
  const vimUI = document.getElementById('vim-ui');
  const inputLine = document.getElementById('input-line');
  const vimText = document.getElementById('vim-text');
  const vimMode = document.getElementById('vim-mode');
  const vimCommand = document.getElementById('vim-command');

  let gitIgnoreExists = false;
  let gitIgnoreStaged = false;
  let indexStaged = false;
  let secretsIgnored = false;
  let gitIgnoreCommitted = false;
  let step = 1;
  let state = 'terminal'; 
  let vimCmdString = '';

  cmdInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && state === 'terminal') {
      const val = this.value.trim();
      printLine(`<span class="prompt">user@machine:~/my-secure-project$</span> ${val}`);
      this.value = '';

      if (val === 'git status') {
        renderGitStatus();
        if (step === 1) {
          updateGuide('🚨 The Security Risk', 
            `Notice the secrets alongside our <code>index.js</code> feature code. Let's protect them immediately.<br><br>Type:<br><span class="highlight">touch .gitignore</span>`);
          step = 2;
        } else if (step === 5 && gitIgnoreStaged && !indexStaged) {
           updateGuide('🎉 Perfect!', 'You successfully staged ONLY the `.gitignore` file. Notice how the secrets are gone, and `index.js` is safely left out of this commit.<br><br>Let\'s lock this in:<br><span class="highlight">git commit -m "Add .gitignore"</span>');
           step = 6;
        } else if (gitIgnoreCommitted) {
           updateGuide('✅ Status Check', 'Look at that! Git accurately reports that <code>.gitignore</code> is safely in history, the secrets are completely invisible, and <code>index.js</code> is waiting patiently for its own separate feature commit.<br><br>Refresh the page to play again!');
        }

      } else if (val === 'touch .gitignore') {
        if (!gitIgnoreExists) {
          gitIgnoreExists = true;
          if (step === 2) {
            updateGuide('Step 3: Edit with Vim', 'Open it up to add our rules:<br><br><span class="highlight">vim .gitignore</span>');
            step = 3;
          }
        }

      } else if (val === 'vim .gitignore') {
        if (gitIgnoreExists) { enterVim(); }

      } else if (val === 'git add .') {
        if (gitIgnoreExists && secretsIgnored) {
          gitIgnoreStaged = true;
          indexStaged = true; // They staged everything!
          updateGuide('🚨 Gotcha! Atomic Commits!', 'You used <code>git add .</code>, which staged BOTH the <code>.gitignore</code> file and your <code>index.js</code> code!<br><br><strong>Best Practice:</strong> Keep commits "atomic" (one logical change at a time). Security updates shouldn\'t be bundled with feature code.<br><br>Let\'s unstage everything by typing:<br><span class="highlight">git reset</span>');
        }

      } else if (val === 'git reset') {
        if (gitIgnoreStaged || indexStaged) {
          gitIgnoreStaged = false;
          indexStaged = false;
          printLine('Unstaged changes after reset:');
          printLine('M\t.gitignore');
          printLine('M\tindex.js');
          updateGuide('Step 5: Stage Intentionally', 'Phew! Now, let\'s be explicit and stage ONLY the file we care about right now.<br><br>Type:<br><span class="highlight">git add .gitignore</span>');
        }

      } else if (val === 'git add .gitignore') {
        if (gitIgnoreExists && secretsIgnored) {
          gitIgnoreStaged = true;
          if (step === 5) {
            updateGuide('Verify the Staging', 'Great! You specifically targeted the file. Type <span class="highlight">git status</span> to see what the staging area looks like now.');
          }
        }

      } else if (val.startsWith('git commit')) {
          if (gitIgnoreStaged && !indexStaged) {
              gitIgnoreStaged = false; 
              gitIgnoreCommitted = true;
              printLine(`[main c0de123] Add .gitignore\n 1 file changed, 3 insertions(+)\n create mode 100644 .gitignore`);
              updateGuide('Mission Accomplished!', 'The rules are safely committed! Type <span class="highlight">git status</span> to see the final, real-world result of our repository.');
              step = 7;
          } else if (gitIgnoreStaged && indexStaged) {
              printLine(`Error: Please unstage index.js using 'git reset' to keep commits atomic before proceeding!`);
          } else {
              printLine(`no changes added to commit`);
          }

      } else if (val === 'clear') { historyDiv.innerHTML = ''; } 
        else if (val !== '') { printLine(`bash: ${val}: command not found`); }
      
      scrollToBottom();
    }
  });

  function renderGitStatus() {
      let outputStr = `On branch main\n\n`;
      let stagedItems = [];
      let untrackedItems = [];

      // Staged Items
      if (gitIgnoreStaged) stagedItems.push('\t<span class="staged">new file:   .gitignore</span>');
      if (indexStaged) stagedItems.push('\t<span class="staged">new file:   index.js</span>');

      // Untracked Items
      if (!secretsIgnored) {
          untrackedItems.push('\t<span class="untracked">.env</span>');
          untrackedItems.push('\t<span class="untracked">credentials/</span>');
          untrackedItems.push('\t<span class="untracked">secrets.json</span>');
      }
      if (!indexStaged) untrackedItems.push('\t<span class="untracked">index.js</span>');
      if (gitIgnoreExists && !gitIgnoreStaged && !gitIgnoreCommitted) untrackedItems.push('\t<span class="untracked">.gitignore</span>');

      if (stagedItems.length > 0) {
          outputStr += `Changes to be committed:\n  (use "git restore --staged <file>..." to unstage)\n${stagedItems.join('\n')}\n\n`;
      }

      if (untrackedItems.length > 0) {
          outputStr += `Untracked files:\n  (use "git add <file>..." to include in what will be committed)\n${untrackedItems.join('\n')}\n\n`;
      }

      if (stagedItems.length === 0 && untrackedItems.length > 0) {
          outputStr += `nothing added to commit but untracked files present`;
      } else if (stagedItems.length > 0 && untrackedItems.length === 0) {
          // Do nothing, standard formatting handled above
      } else if (stagedItems.length === 0 && untrackedItems.length === 0) {
          outputStr += `nothing to commit, working tree clean`;
      }

      printLine(outputStr.trimEnd());
  }

  // Vim Logic (Unchanged)
  function enterVim() {
    state = 'vim-normal'; inputLine.style.display = 'none'; vimUI.style.display = 'flex';
    updateGuide('🛑 Vim: Normal Mode', 'Press <span class="highlight">i</span> to enter Insert Mode.');
    document.addEventListener('keydown', vimKeyListener);
  }

  function vimKeyListener(e) {
    if (state === 'vim-normal') {
      if (e.key === 'i') {
        e.preventDefault(); state = 'vim-insert'; vimMode.innerText = '-- INSERT --';
        vimText.removeAttribute('readonly'); vimText.focus();
        updateGuide('🟢 Vim: Insert Mode', 'Add the files to ignore:<div class="code-block">.env<br>secrets.json<br>credentials/</div>Then press <span class="highlight">Esc</span>.');
      }
      if (e.key === ':') { e.preventDefault(); state = 'vim-command'; vimCmdString = ':'; vimCommand.innerText = vimCmdString; }
    } else if (state === 'vim-insert') {
      if (e.key === 'Escape') {
        state = 'vim-normal'; vimMode.innerText = ''; vimText.setAttribute('readonly', 'true');
        updateGuide('🟡 Vim: Back to Normal', 'Type <span class="highlight">:wq</span> and press Enter.');
      }
    } else if (state === 'vim-command') {
      if (e.key === 'Enter') {
        if (vimCmdString === ':wq') exitVim();
        else { vimCmdString = ':'; vimCommand.innerText = 'Error'; setTimeout(() => { vimCommand.innerText = ''; state = 'vim-normal'; }, 500); }
      } else if (e.key === 'Backspace') {
        vimCmdString = vimCmdString.slice(0, -1); vimCommand.innerText = vimCmdString;
        if (vimCmdString === '') state = 'vim-normal';
      } else if (e.key.length === 1) { vimCmdString += e.key; vimCommand.innerText = vimCmdString; }
    }
  }

  function exitVim() {
    document.removeEventListener('keydown', vimKeyListener);
    state = 'terminal'; vimUI.style.display = 'none'; inputLine.style.display = 'block'; cmdInput.focus();
    
    const content = vimText.value;
    if (content.includes('.env') && content.includes('secrets.json') && content.includes('credentials/')) {
        secretsIgnored = true;
        updateGuide('Step 5: Stage Responsibly', 'Notice how the secrets are immediately gone from Git\'s radar! But we still have our <code>.gitignore</code> and <code>index.js</code> files.<br><br>Let\'s see what happens if you try to stage everything at once. Type:<br><br><span class="highlight">git add .</span>');
        step = 5;
    } else {
        updateGuide('Try again', 'You missed some files! Type <span class="highlight">vim .gitignore</span> again.');
    }
    printLine(`".gitignore" written`); scrollToBottom();
  }

  function printLine(html) { const div = document.createElement('div'); div.className = 'output'; div.innerHTML = html; historyDiv.appendChild(div); }
  function updateGuide(title, body) { guideCard.innerHTML = `<h2>${title}</h2><p>${body}</p>`; }
  function scrollToBottom() { terminalContainer.scrollTop = terminalContainer.scrollHeight; }
</script>

</body>
</html>
