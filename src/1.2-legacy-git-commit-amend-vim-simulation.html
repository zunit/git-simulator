<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Amend with Vim Simulator</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    height: 100vh;
    margin: 0;
    background-color: #1e1e1e;
    color: #fff;
  }
  #terminal-container {
    flex: 2;
    background-color: #121212;
    padding: 20px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 16px;
    overflow-y: auto;
    position: relative;
  }
  #guide-container {
    flex: 1;
    background-color: #252526;
    padding: 30px;
    border-left: 2px solid #333;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .prompt { color: #4af626; }
  .command-input {
    background: transparent;
    border: none;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    font-size: 16px;
    outline: none;
    width: 70%;
  }
  .output { color: #ccc; margin-bottom: 10px; white-space: pre-wrap; line-height: 1.4; }
  .untracked { color: #ff5252; }
  .staged { color: #4af626; }
  
  /* Vim Styles */
  #vim-ui {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #121212;
    padding: 20px;
    flex-direction: column;
    z-index: 10;
  }
  #vim-text {
    flex-grow: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    font-size: 16px;
    outline: none;
    resize: none;
  }
  #vim-status-bar {
    display: flex;
    justify-content: space-between;
    height: 20px;
    font-weight: bold;
  }
  #vim-mode { color: #4af626; }
  #vim-command { color: #fff; }

  .popup-card {
    background: #333;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  .popup-card h2 { margin-top: 0; color: #4af626; }
  .highlight { color: #ffca28; font-weight: bold; }
</style>
</head>
<body>

<div id="terminal-container">
  <div id="history">
    <div class="output">Commit successful: [main 9b8c7d6] Add homepage layout</div>
  </div>
  <div id="input-line">
    <span class="prompt">user@machine:~/my-project$</span>
    <input type="text" id="cmd" class="command-input" autocomplete="off" autofocus>
  </div>

  <div id="vim-ui">
    <textarea id="vim-text" readonly>Add homepage layout

# Please enter the commit message for your changes. Lines starting
# with '#' will be ignored, and an empty message aborts the commit.
#
# Date:      Fri Mar 13 11:45:00 2026 -0400
#
# On branch main
# Your branch is up to date with 'origin/main'.
#
# Changes to be committed:
#       new file:   styles.css
#       modified:   index.html</textarea>
    <div id="vim-status-bar">
      <span id="vim-mode">"~/my-project/.git/COMMIT_EDITMSG"</span>
      <span id="vim-command"></span>
    </div>
  </div>
</div>

<div id="guide-container">
  <div class="popup-card" id="guide-card">
    <h2>Step 1: The Leftover File</h2>
    <p>You committed your HTML, but forgot the CSS again!</p>
    <p>Let's check the status:</p>
    <p class="highlight">git status</p>
  </div>
</div>

<script>
  const cmdInput = document.getElementById('cmd');
  const historyDiv = document.getElementById('history');
  const guideCard = document.getElementById('guide-card');
  const terminalContainer = document.getElementById('terminal-container');
  const vimUI = document.getElementById('vim-ui');
  const inputLine = document.getElementById('input-line');
  const vimText = document.getElementById('vim-text');
  const vimMode = document.getElementById('vim-mode');
  const vimCommand = document.getElementById('vim-command');

  let fileState = 'untracked'; 
  let step = 1;
  let state = 'terminal'; 
  let vimCmdString = '';

  cmdInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && state === 'terminal') {
      const val = this.value.trim();
      printLine(`<span class="prompt">user@machine:~/my-project$</span> ${val}`);
      this.value = '';

      if (val === 'git status') {
        if (fileState === 'untracked') {
          printLine(`On branch main\nYour branch is up to date with 'origin/main'.\n\nUntracked files:\n  (use "git add <file>..." to include in what will be committed)\n\t<span class="untracked">styles.css</span>\n\nnothing added to commit but untracked files present`);
          if (step === 1) {
            updateGuide('Step 2: Stage the File', 'There it is. Let\'s stage it:<br><br><span class="highlight">git add styles.css</span>');
            step = 2;
          }
        } else if (fileState === 'staged') {
          printLine(`On branch main\nYour branch is up to date with 'origin/main'.\n\nChanges to be committed:\n  (use "git restore --staged <file>..." to unstage)\n\t<span class="staged">new file:   styles.css</span>`);
        } else if (fileState === 'committed') {
          printLine(`On branch main\nYour branch is up to date with 'origin/main'.\n\nnothing to commit, working tree clean`);
        }

      } else if (val === 'git add styles.css' || val === 'git add .') {
        if (fileState === 'untracked') {
          fileState = 'staged';
          if (step === 2) {
            updateGuide('Step 3: Amend without --no-edit', 'File staged! Now, let\'s amend it, but this time we will let Git open Vim so we can confirm the message.<br><br>Type:<br><br><span class="highlight">git commit --amend</span>');
            step = 3;
          }
        }

      } else if (val === 'git commit --amend') {
        if (fileState === 'staged') {
          enterVim();
        } else {
          printLine(`No changes added to commit (use "git add" and/or "git commit -a")`);
        }

      } else if (val === 'clear') {
        historyDiv.innerHTML = '';
      } else if (val !== '') {
        printLine(`bash: ${val}: command not found\n(Hint: Follow the guide!)`);
      }
      
      scrollToBottom();
    }
  });

  function printLine(html) {
    const div = document.createElement('div');
    div.className = 'output';
    div.innerHTML = html;
    historyDiv.appendChild(div);
  }

  function enterVim() {
    state = 'vim-normal';
    inputLine.style.display = 'none';
    vimUI.style.display = 'flex';
    updateGuide('🟡 Vim: Review & Save', 'Vim is open! Your previous message is already at the top ("Add homepage layout"). Notice that `styles.css` is listed in the files to be committed.<br><br>Since the message is fine as-is, just type <span class="highlight">:wq</span> and hit <strong>Enter</strong> to save and quit.');
    
    document.addEventListener('keydown', vimKeyListener);
  }

  function vimKeyListener(e) {
    if (state === 'vim-normal') {
      if (e.key === 'i') {
        e.preventDefault();
        state = 'vim-insert';
        vimMode.innerText = '-- INSERT --';
        vimText.removeAttribute('readonly');
        vimText.focus();
        vimText.setSelectionRange(0, 0); 
        updateGuide('🟢 Vim: Insert Mode', 'You entered Insert mode! You can tweak the message if you want. Press <span class="highlight">Esc</span> when done.');
      }
      if (e.key === ':') {
        e.preventDefault();
        state = 'vim-command';
        vimCmdString = ':';
        vimCommand.innerText = vimCmdString;
        updateGuide('🟡 Vim: Command Mode', 'Type <span class="highlight">wq</span> and press <strong>Enter</strong> to write and quit.');
      }
    } else if (state === 'vim-insert') {
      if (e.key === 'Escape') {
        state = 'vim-normal';
        vimMode.innerText = '';
        vimText.setAttribute('readonly', 'true');
        updateGuide('🟡 Vim: Back to Normal', 'Type <span class="highlight">:wq</span> and press <strong>Enter</strong>.');
      }
    } else if (state === 'vim-command') {
      if (e.key === 'Enter') {
        if (vimCmdString === ':wq') {
          exitVim();
        } else {
          vimCmdString = ':';
          vimCommand.innerText = 'E492: Not an editor command';
          setTimeout(() => { vimCommand.innerText = ''; state = 'vim-normal'; }, 1000);
        }
      } else if (e.key === 'Backspace') {
        vimCmdString = vimCmdString.slice(0, -1);
        vimCommand.innerText = vimCmdString;
        if (vimCmdString === '') state = 'vim-normal';
      } else if (e.key.length === 1) {
        vimCmdString += e.key;
        vimCommand.innerText = vimCmdString;
      }
    }
  }

  function exitVim() {
    document.removeEventListener('keydown', vimKeyListener);
    state = 'terminal';
    vimUI.style.display = 'none';
    inputLine.style.display = 'block';
    cmdInput.focus();
    
    const firstLine = vimText.value.split('\n')[0];
    const commitMsg = firstLine.trim() !== '' ? firstLine : 'Empty message';
    
    fileState = 'committed';
    printLine(`[main f1e2d3c] ${commitMsg}\n Date: Fri Mar 13 11:45:00 2026 -0400\n 2 files changed, 120 insertions(+)`);
    updateGuide('🎉 Absorbed!', 'You did it! You successfully amended the commit. Now, try typing <span class="highlight">git status</span> to see your fully clean directory.');
    scrollToBottom();
  }

  function updateGuide(title, body) {
    guideCard.innerHTML = `<h2>${title}</h2><p>${body}</p>`;
  }

  function scrollToBottom() {
    terminalContainer.scrollTop = terminalContainer.scrollHeight;
  }
</script>

</body>
</html>
