if (e.key === \":\") { e.preventDefault(); this.vimCmd = \":\"; this.setState({ mode: \"vim-command\", vimCommand: \":\" }); }\n    } else if (m === \"vim-insert\") {\n      if (e.key === \"Escape\") { e.preventDefault(); this.escToNormal(); }\n    } else if (m === \"vim-command\") {\n      if (e.key === \"Enter\") { e.preventDefault(); this.runVimCommand(); }\n      else if (e.key === \"Escape\") { e.preventDefault(); this.vimCmd = \"\"; this.setState({ vimCommand: \"\", mode: \"vim-normal\" }); }\n      else if (e.key === \"Backspace\") { e.preventDefault(); this.vimCmd = this.vimCmd.slice(0, -1); this.setState({ vimCommand: this.vimCmd }); if (!this.vimCmd) this.setState({ mode: \"vim-normal\" }); }\n      else if (e.key.length === 1) { e.preventDefault(); this.vimCmd += e.key; this.setState({ vimCommand: this.vimCmd }); }\n    }\n  };\n  escToNormal() {\n    if (this.state.mode !== \"vim-insert\") return;\n    this.setState({ mode: \"vim-normal\", vimStatusLeft: \"\", vimReadonly: true });\n    this.updateGuide(\"🟡 Vim: Back to normal\", \"Save & quit: type \" + this.hl(\":wq\") + \" then Enter — or press the button.\");\n  }\n  writeQuit() { this.exitVim(true); }\n  runVimCommand() {\n    const c = this.vimCmd, dirty = this.state.vimText !== this._disk;\n    const err = msg => { this.setState({ vimCommand: msg }); setTimeout(() => { this.vimCmd = \"\"; this.setState({ vimCommand: \"\", mode: \"vim-normal\" }); }, 1600); };\n    if (c === \":w\" || c === \":w!\") {\n      this._disk = this.state.vimText;\n      const wt = this.clone(this.state.workingTree); wt[this.state.vimFile] = this.state.vimText;\n      this.vimCmd = \"\";\n      this.setState({ workingTree: wt, mode: \"vim-normal\", vimCommand: \"\", vimStatusLeft: '\"' + this.state.vimFile + '\" written' }, () => this.afterCmd());\n      return;\n    }\n    if (c === \":wq\" || c === \":wq!\" || c === \":x\") return this.exitVim(true);\n    if (c === \":q!\") return this.exitVim(false);\n    if (c === \":q\") { if (dirty) return err(\"E37: No write since last change (add ! to override)\"); return this.exitVim(false); }\n    err(\"E492: Not an editor command: \" + this.escape(c.replace(/^:/, \"\")));\n  }\n  exitVim(save) {\n    document.removeEventListener(\"keydown\", this.vimKeyListener);\n    const f = this.state.vimFile;\n    if (save) {\n      const wt = this.clone(this.state.workingTree); wt[f] = this.state.vimText;\n      this.setState({ mode: \"terminal\", workingTree: wt, _guideHint: null }, () => { if (this.inputRef.current) this.inputRef.current.focus(); this.afterCmd(); });\n      this.print('\"' + f + '\" ' + this.state.vimText.split(\"\\n\").length + \"L written\");\n    } else {\n      this.setState({ mode: \"terminal\", _guideHint: null }, () => { if (this.inputRef.current) this.inputRef.current.focus(); });\n    }\n  }\n\n  // ================= steps =================\n  steps() {\n    const S = this.state;\n    const head = this.headTree(), idx = S.index, wt = S.workingTree;\n    const g = \"greetings.txt\", app = \"app.py\";\n    return [\n      // ---------- PART 1 ----------\n      { id: \"p1a\", part: 0, title: \"Start the repo\", body: \"Every diff compares two of git's three trees. First we need a repo.<br><br>Run:<br>\" + this.hl(\"git init\"), done: () => S.repoInit },\n      { id: \"p1b\", part: 0, title: \"One committed file\", body: \"Create a file and commit it, so all three trees hold the same thing.<br><br>\" + this.hl('echo \"Hello\" > greetings.txt') + \"<br>\" + this.hl(\"git add greetings.txt\") + \"<br>\" + this.hl('git commit -m \"initial greeting\"'), done: () => head[g] !== undefined },\n      { id: \"p1c\", part: 0, title: \"Change the working tree\", body: \"Add a line — but do <strong>not<\u002Fstrong> stage it yet.<br><br>\" + this.hl('echo \"Hola\" >> greetings.txt') + \"<br><br>Watch the THREE TREES panel: Working now differs from Staging and HEAD.\", done: () => wt[g] !== undefined && wt[g] !== idx[g] },\n      { id: \"p1d\", part: 0, title: \"Unstaged changes\", body: \"Plain \" + this.hl(\"git diff\") + \" compares <strong>Working ↔ Staging<\u002Fstrong>.\", expect: /^git diff$/, predict: { q: \"You changed the file but haven't staged it. What will <code>git diff<\u002Fcode> show?\", options: [\"Nothing — output is empty\", \"The + Hola line\", \"An error\"], correct: 1, wrong: { 0: \"That's the most common guess — usually because it feels like the commit <em>drained<\u002Fem> the staging area. It didn't. The index still holds <code>Hello<\u002Fcode>, while your working file now holds <code>Hello<\u002Fcode> + <code>Hola<\u002Fcode>. Those two differ, so <code>git diff<\u002Fcode> has plenty to show. Check the panel: Working ≠ Staging.\", 2: \"No error — <code>git diff<\u002Fcode> is read-only and always safe to run. It's one of the few git commands you can fire off any time without changing a thing.\" }, explain: \"Right: <code>git diff<\u002Fcode> compares Working against Staging. Your edit is in Working only, so it shows up as <span style=\\\"color:#7ee787\\\">+Hola<\u002Fspan>.\" } },\n      { id: \"p1e\", part: 0, title: \"Nothing staged since the commit\", body: this.hl(\"git diff --staged\") + \" compares <strong>Staging ↔ HEAD<\u002Fstrong>.<br><br>Your commit did <strong>not<\u002Fstrong> empty the staging area — look at the panel above: Staging still holds <code>Hello<\u002Fcode>. The index is a <em>full snapshot<\u002Fem> that currently matches HEAD.\", expect: /^git diff --(staged|cached)$/, predict: { q: \"You haven't staged this change yet. What will <code>git diff --staged<\u002Fcode> show?\", options: [\"The + Hola line\", \"Nothing — output is empty\", \"The same as git diff\"], correct: 1, wrong: { 0: \"That's what plain <code>git diff<\u002Fcode> shows. <code>--staged<\u002Fcode> compares a different pair — Staging ↔ HEAD — and your Hola edit never reached Staging. It's still only in the working tree.\", 2: \"They'd only match if your change were staged. Right now <code>git diff<\u002Fcode> spans Working ↔ Staging (shows Hola) and <code>--staged<\u002Fcode> spans Staging ↔ HEAD (shows nothing). Different pairs, different answers.\" }, explain: \"Right — but <strong>not<\u002Fstrong> because staging is empty. Committing never empties the index: it still holds every tracked file (see the Staging column). It simply <em>matches HEAD<\u002Fem> now, and diff only reports <em>differences<\u002Fem> — so two identical snapshots print nothing.\" } },\n      { id: \"p1f\", part: 0, title: \"Now stage it\", body: \"Run:<br>\" + this.hl(\"git add greetings.txt\") + \"<br><br>In the panel, Working and Staging now match each other — and both differ from HEAD.\", done: () => idx[g] === wt[g] && idx[g] !== head[g] },\n      { id: \"p1g\", part: 0, title: \"⚠ The moment that confuses everyone\", body: \"You just staged your change. Now run plain \" + this.hl(\"git diff\") + \" again.\", expect: /^git diff$/, predict: { q: \"Your change is staged. What does plain <code>git diff<\u002Fcode> show now?\", options: [\"The + Hola line, same as before\", \"Nothing — output is empty\", \"It shows the change in a different colour\"], correct: 1, wrong: { 0: \"This is exactly the trap. Staging moved the change <em>into<\u002Fem> the index — so Working and Staging are now identical, and those are precisely the two trees <code>git diff<\u002Fcode> compares. Your work isn't gone; you're looking at the wrong pair.\", 2: \"Colour never encodes staged vs unstaged — green and red only mean added and removed lines. What actually changed is which two trees now match each other.\" }, explain: \"<strong>This is the #1 git diff confusion.<\u002Fstrong> Your work is NOT gone. <code>git diff<\u002Fcode> only compares Working ↔ Staging, and those are now identical. To see staged work you must ask for the other pair.\" } },\n      { id: \"p1h\", part: 0, title: \"Where the change went\", body: \"Prove the change still exists with \" + this.hl(\"git diff --staged\") + \".\", expect: /^git diff --(staged|cached)$/, predict: { q: \"So where is the change? What will <code>git diff --staged<\u002Fcode> show?\", options: [\"Nothing\", \"The + Hola line\", \"An error, because it's already staged\"], correct: 1, wrong: { 0: \"It has to be somewhere — you staged the change, you didn't discard it. Staging now differs from HEAD, and that is exactly the pair <code>--staged<\u002Fcode> compares.\", 2: \"Being staged is the <em>precondition<\u002Fem> for <code>--staged<\u002Fcode> to show anything. It's never an error.\" }, explain: \"Exactly. Staging now differs from HEAD, so the change appears here. Nothing was ever lost — you were just looking at the wrong pair of trees.\" } },\n      { id: \"p1i\", part: 0, title: \"Boss level: all three differ\", body: \"Add another line <em>without<\u002Fem> staging it:<br>\" + this.hl('echo \"Bonjour\" >> greetings.txt') + \"<br><br>Now Working, Staging and HEAD are all different.\", done: () => wt[g] !== idx[g] && idx[g] !== head[g] && wt[g] !== head[g] },\n      { id: \"p1j\", part: 0, title: \"The catch-all\", body: this.hl(\"git diff HEAD\") + \" compares <strong>Working ↔ HEAD<\u002Fstrong> — every uncommitted change, staged or not.\", expect: /^git diff HEAD$/, predict: { q: \"Hola is staged; Bonjour is not. What will <code>git diff HEAD<\u002Fcode> show?\", options: [\"Only + Bonjour\", \"Only + Hola\", \"Both + Hola and + Bonjour\"], correct: 2, wrong: { 0: \"That's what plain <code>git diff<\u002Fcode> shows (Working ↔ Staging). <code>git diff HEAD<\u002Fcode> ignores the staging area completely.\", 1: \"That's what <code>--staged<\u002Fcode> shows (Staging ↔ HEAD). Adding <code>HEAD<\u002Fcode> compares your working files against the last commit, so unstaged work counts too.\" }, explain: \"Right. <code>git diff HEAD<\u002Fcode> skips the staging area entirely and compares your working files against the last commit — so it shows everything uncommitted.\" } },\n      { id: \"p1k\", part: 0, title: \"Lock it in\", body: \"Commit everything and finish Part 1:<br>\" + this.hl('git commit -am \"add spanish and french\"'), done: () => head[g] === wt[g] && wt[g] && wt[g].indexOf(\"Bonjour\") >= 0 },\n\n      // ---------- PART 2 ----------\n      { id: \"p2a\", part: 1, title: \"Load the code file\", body: \"Part 2 is about <em>reading<\u002Fem> diffs. Press the button to create and commit a small Python file.\", action: \"mkApp\", done: () => head[app] !== undefined },\n      { id: \"p2b\", part: 1, title: \"You run the auto-formatter\", body: \"On <strong>your own machine<\u002Fstrong>, you ran the project's auto-formatter over <code>app.py<\u002Fcode> — it reindented every line from 4 spaces to 2. While you were in there you also changed one bit of wording.<br><br>All of it is sitting <strong>unstaged in your working tree<\u002Fstrong>.\", action: \"messy\", done: () => wt[app] === this.APP_MESSY },\n      { id: \"p2c\", part: 1, title: \"The scary diff\", body: \"Run \" + this.hl(\"git diff\") + \" and look at how big it is.\", expect: /^git diff$/, predict: { q: \"The file was re-indented from 4 spaces to 2, and one word was changed. How many lines will the diff mark as changed?\", options: [\"Just 1 — only the real change\", \"Almost every line\", \"None\"], correct: 1, wrong: { 0: \"Diff compares line by line, not word by word. Re-indenting rewrites the whole line, so every reindented line counts as removed + added — even though the code on it is identical.\", 2: \"The file definitely changed — the working tree no longer matches the index.\" }, explain: \"Diff works line by line. Changing the indentation rewrites the whole line, so nearly every line shows as removed + added. The one real change is hidden in the noise — this is why big diffs feel unreviewable.\" } },\n      { id: \"p2d\", part: 1, title: \"Decode the @@ header\", body: \"Look at the hunk header in your diff — it starts with <span style=\\\"color:#42a5f5\\\">@@<\u002Fspan>.<br><br>It reads: <strong>old file<\u002Fstrong> from line X, N lines &nbsp;→&nbsp; <strong>new file<\u002Fstrong> from line Y, M lines. <code>-<\u002Fcode> is always the old side (a/), <code>+<\u002Fcode> the new (b/).\", predictOnly: true, predict: { q: \"A hunk header reads <code>@@ -20,3 +20,6 @@<\u002Fcode>. What happened?\", options: [\"3 lines were deleted starting at line 20\", \"3 old lines became 6 new lines — the file grew by 3\", \"Lines 20 to 26 were all rewritten\"], correct: 1, wrong: { 0: \"The <code>-20,3<\u002Fcode> half only says the OLD file had 3 lines in that region — it doesn't mean they were deleted. Compare it against the <code>+20,6<\u002Fcode> half to see what they became.\", 2: \"Those numbers are <em>start line + line count<\u002Fem>, not a start–end range. <code>+20,6<\u002Fcode> means 6 lines beginning at line 20, not lines 20 through 26.\" }, explain: \"The first pair is the old file's range, the second the new file's. 3 lines in, 6 lines out — a net gain of 3 lines in that region.\" } },\n      { id: \"p2e\", part: 1, title: \"Cut through the noise\", body: \"Now ignore whitespace entirely:<br>\" + this.hl(\"git diff -w\"), expect: /^git diff (-w|--ignore-all-space)$/, predict: { q: \"With <code>-w<\u002Fcode>, how much of that huge diff remains?\", options: [\"All of it — -w only affects colour\", \"One line: Bye → Goodbye\", \"Nothing at all\"], correct: 1, wrong: { 0: \"<code>-w<\u002Fcode> changes what <em>counts<\u002Fem> as a difference, not how it's painted. Lines that differ only in whitespace stop being differences at all.\", 2: \"There's still one genuine change in there — Bye became Goodbye. <code>-w<\u002Fcode> hides whitespace noise, never real edits.\" }, explain: \"<strong>This is the professional move.<\u002Fstrong> <code>-w<\u002Fcode> ignores whitespace changes, collapsing a 14-line diff to the single real edit. Reach for it any time a diff looks bigger than the change described.\" } },\n      { id: \"p2f\", part: 1, title: \"Zoom into the words\", body: \"A one-word edit still shows as a whole line removed and re-added. Fix that with:<br>\" + this.hl(\"git diff -w --word-diff\"), expect: /^git diff -w --word-diff$|^git diff --word-diff -w$/, predict: { q: \"What does <code>--word-diff<\u002Fcode> change about the output?\", options: [\"It marks only the words that differ, inline\", \"It sorts the diff alphabetically\", \"It shows one file per line\"], correct: 0, wrong: { 1: \"Diff never reorders your content — output always follows the order of the file.\", 2: \"That's <code>--name-only<\u002Fcode> or <code>--stat<\u002Fcode>. <code>--word-diff<\u002Fcode> changes the granularity <em>within<\u002Fem> a line.\" }, explain: 'Instead of a red line plus a green line, you get <span style=\"color:#ff8a80\">[-Bye-]<\u002Fspan><span style=\"color:#7ee787\">{+Goodbye+}<\u002Fspan> inline — instantly obvious what actually changed.' } },\n      { id: \"p2g\", part: 1, title: \"Size before you read\", body: \"Good habit: check the <em>scale<\u002Fem> of a change first.<br><br>Run \" + this.hl(\"git diff --stat\") + \" — files changed, and how much.\", expect: /^git diff --stat$/, done: () => S.stepDone[\"p2g\"] },\n      { id: \"p2h\", part: 1, title: \"Commit the reviewed change\", body: \"You've verified it's a reformat plus one word. Commit it:<br>\" + this.hl('git commit -am \"reformat and fix farewell wording\"'), done: () => head[app] === this.APP_MESSY },\n\n      // ---------- PART 3 ----------\n      { id: \"p3a\", part: 2, title: \"Act A · Review an incoming patch\", body: \"A teammate emailed you a patch file and you applied it with <code>git apply<\u002Fcode> — so their edits now sit <strong>unstaged in your working tree<\u002Fstrong>, exactly as if you had typed them yourself.<br><br>It fixes a real bug — and smuggles in two things that must never reach the repo. Review it before you stage anything.\", action: \"teammate\", done: () => wt[app] === this.APP_TEAMMATE },\n      { id: \"p3b\", part: 2, title: \"Review before staging\", body: \"Never stage blind. Look first:<br>\" + this.hl(\"git diff\"), expect: /^git diff$/, predict: { q: \"Scan the diff you're about to run. Besides the <code>.strip()<\u002Fcode> bug fix, what else did your teammate add?\", options: [\"Nothing — it's a clean one-line fix\", \"A hardcoded API key and a debug print\", \"A new function\"], correct: 1, wrong: { 0: \"Look at the <code>+<\u002Fcode> lines again — there is more than one. This is precisely why you review a diff <em>before<\u002Fem> staging it.\", 2: \"No new function was added. The extra lines sit at the top of the file and inside <code>greet<\u002Fcode>.\" }, explain: \"Read it carefully: there's a live <code>sk_live_…<\u002Fcode> API key and a <code>DEBUG<\u002Fcode> print. Committing a secret is a genuine security incident — and reading the diff is the cheapest way to catch it.\" } },\n      { id: \"p3c\", part: 2, title: \"Remove the secret\", body: (() => {\n        const c = wt[app] || \"\";\n        const chk = (ok, txt) => '<div style=\"display:flex;gap:8px;align-items:baseline\"><span style=\"color:' + (ok ? \"#4af626\" : \"#ff8a80\") + '\">' + (ok ? \"✓\" : \"✗\") + '<\u002Fspan><span style=\"color:' + (ok ? \"#8a8f98\" : \"#eee\") + '\">' + txt + \"<\u002Fspan><\u002Fdiv>\";\n        return \"Open the file and delete both the <strong>API_KEY line<\u002Fstrong> (and the blank line after it) and the <strong>DEBUG print<\u002Fstrong> — keep the <code>.strip()<\u002Fcode> fix.<br><br>\" + this.hl(\"vim app.py\") + \" → \" + this.hl(\"i\") + \" → edit → \" + this.hl(\"Esc\") + \" → \" + this.hl(\":wq\") +\n          '<div style=\"margin-top:13px;padding-top:11px;border-top:1px solid #4a4a4a;font-size:13px;display:flex;flex-direction:column;gap:5px\"><div style=\"color:#8a8f98;font-size:11px;letter-spacing:1px;margin-bottom:3px\">UNLOCKS WHEN ALL THREE PASS<\u002Fdiv>' +\n          chk(c.indexOf(\"sk_live_\") < 0, \"API_KEY line removed\") + chk(c.indexOf(\"DEBUG\") < 0, \"DEBUG print removed\") + chk(c.indexOf(\".strip()\") >= 0, \"<code>.strip()<\u002Fcode> fix kept\") + \"<\u002Fdiv>\";\n      })(), done: () => wt[app] && wt[app].indexOf(\"sk_live_\") < 0 && wt[app].indexOf(\"DEBUG\") < 0 && wt[app].indexOf(\".strip()\") >= 0 },\n      { id: \"p3d\", part: 2, title: \"The last look\", body: \"Stage it, then do the final check that catches mistakes:<br>\" + this.hl(\"git add app.py\") + \"<br>\" + this.hl(\"git diff --staged\"), expect: /^git diff --(staged|cached)$/, predict: { q: \"What should <code>git diff --staged<\u002Fcode> show now — this is your last chance before it becomes history.\", options: [\"The API key is still there\", \"Only the .strip() fix\", \"Nothing\"], correct: 1, wrong: { 0: \"You removed it from the working tree and then staged that version — so the key is gone from what you're about to commit. That's the whole point of checking.\", 2: \"There <em>is<\u002Fem> a real change staged: the <code>.strip()<\u002Fcode> fix. <code>--staged<\u002Fcode> shows it because Staging now differs from HEAD.\" }, explain: \"<strong>Make this a reflex:<\u002Fstrong> <code>git diff --staged<\u002Fcode> immediately before every commit shows exactly what you're about to record — nothing more, nothing less.\" } },\n      { id: \"p3e\", part: 2, title: \"Commit the clean fix\", body: \"Now it's safe:<br>\" + this.hl('git commit -m \"trim whitespace from greeting name\"'), done: () => head[app] && head[app].indexOf(\"sk_live_\") < 0 && head[app].indexOf(\".strip()\") >= 0 },\n      { id: \"p3f\", part: 2, title: \"Act B · Build a branch to review\", body: \"Make a feature branch with its own commit:<br>\" + this.hl(\"git switch -c feature\") + \"<br>\" + this.hl('echo \"Ciao\" >> greetings.txt') + \"<br>\" + this.hl('git commit -am \"add italian\"'), done: () => S.branches.feature && S.commits[S.branches.feature] && (S.commits[S.branches.feature].tree[g] || \"\").indexOf(\"Ciao\") >= 0 },\n      { id: \"p3g\", part: 2, title: \"Move main forward too\", body: \"Real branches diverge — main keeps moving while you work:<br>\" + this.hl(\"git switch main\") + \"<br>\" + this.hl('echo \"Hej\" >> greetings.txt') + \"<br>\" + this.hl('git commit -am \"add swedish\"'), done: () => S.HEAD === \"main\" && (head[g] || \"\").indexOf(\"Hej\") >= 0 },\n      { id: \"p3h\", part: 2, title: \"Two-dot: the tips\", body: this.hl(\"git diff main..feature\") + \" compares the two branch tips <em>as they are right now<\u002Fem>.\", expect: /^git diff main\\.\\.feature$/, predict: { q: \"main has Hej, feature has Ciao. What does <code>main..feature<\u002Fcode> show?\", options: [\"Only + Ciao\", \"+ Ciao and − Hej\", \"Nothing\"], correct: 1, wrong: { 0: \"That's the <em>three-dot<\u002Fem> answer. Two-dot compares the two tips directly, so main's own commit shows up as well.\", 2: \"The branches genuinely differ — each one added a line the other doesn't have.\" }, explain: \"Two-dot compares the tips directly, so main's own new work (Hej) appears as a <em>removal<\u002Fem>. That's rarely what you want when reviewing someone's branch — it makes their change look bigger than it is.\" } },\n      { id: \"p3i\", part: 2, title: \"Three-dot: what a PR shows\", body: this.hl(\"git diff main...feature\") + \" compares from the <strong>merge base<\u002Fstrong> — only what feature actually added.\", expect: /^git diff main\\.\\.\\.feature$/, predict: { q: \"Same two branches. What does the three-dot form show?\", options: [\"+ Ciao and − Hej, same as before\", \"Only + Ciao\", \"Nothing\"], correct: 1, wrong: { 0: \"That's the <em>two-dot<\u002Fem> result. Three-dot starts from the merge base, which excludes whatever main did separately.\", 2: \"feature did add something relative to where it branched off — Ciao.\" }, explain: \"<strong>Three-dot is what GitHub shows in a pull request.<\u002Fstrong> It ignores what main did separately and shows only the branch's own contribution. Use it whenever you review a branch.\" } },\n      { id: \"p3j\", part: 2, title: \"Act C · Find what changed in history\", body: \"Diffs aren't only for uncommitted work. Compare two points in history:<br>\" + this.hl(\"git diff HEAD~2 HEAD\") + \"<br><br>Then try scoping it: \" + this.hl(\"git diff HEAD~2 HEAD -- greetings.txt\"), expect: /^git diff HEAD~2 HEAD$/, done: () => S.stepDone[\"p3j\"] },\n      { id: \"p3k\", part: 2, title: \"Final challenge — no hints\", body: \"Prove you own this. Using only diff commands, answer for yourself:<br><br>1. Get into a state where \" + this.hl(\"git diff\") + \" is empty but \" + this.hl(\"git diff HEAD\") + \" is not.<br>2. Show only the file <em>names<\u002Fem> changed between HEAD~1 and HEAD (\" + this.hl(\"--name-only\") + \").<br><br>Then press Done.\", action: \"finish\", done: () => S.stepDone[\"p3k\"] }\n    ];\n  }\n\n  currentStep() {\n    const all = this.steps();\n    for (const st of all) if (!this.state.stepDone[st.id]) return st;\n    return null;\n  }\n  // Latch completed steps in order so progress can never rewind when a\n  // transient condition (e.g. \"working differs from index\") stops being true.\n  latchSteps() {\n    const sd = this.clone(this.state.stepDone);\n    let changed = false, guard = 0;\n    while (guard++ < 50) {\n      const all = this.steps();\n      const st = all.find(x => !sd[x.id]);\n      if (!st || !st.done || !st.done()) break;\n      sd[st.id] = true; changed = true;\n    }\n    return changed ? sd : null;\n  }\n  partProgress() {\n    const all = this.steps();\n    const cur = this.currentStep();\n    return { cur: cur, activePart: cur ? cur.part : 3, all: all };\n  }\n\n  afterCmd(rawVal) {\n    if (rawVal) {\n      const norm = rawVal.trim().replace(/\\s+/g, \" \");\n      const st = this.currentStep();\n      if (st && st.expect && st.expect.test(norm)) {\n        const sd = this.clone(this.state.stepDone); sd[st.id] = true;\n        this.setState({ stepDone: sd }, () => this.checkDone());\n        return;\n      }\n    }\n    this.setState({ _guideHint: null }, () => this.checkDone());\n  }\n  checkDone() {\n    const sd = this.latchSteps();\n    if (sd) { this.setState({ stepDone: sd }, () => this.checkDone()); return; }\n    if (!this.currentStep() && !this.state.confettiFired) {\n      this.setState({ confettiFired: true });\n      this.launchConfetti();\n    }\n  }\n  updateGuide(title, body) { this.setState({ _guideHint: { title: title, body: body } }); }\n\n  answerPredict(idx) {\n    const st = this.currentStep(); if (!st || !st.predict) return;\n    if (this.state.predictOK[st.id]) return; // already correct, locked in\n    const pa = this.clone(this.state.predictAns); pa[st.id] = idx;\n    const ok = this.clone(this.state.predictOK);\n    const right = idx === st.predict.correct;\n    if (right) ok[st.id] = true;\n    this.setState({ predictAns: pa, predictOK: ok }, () => {\n      if (right && st.predictOnly) {\n        const sd = this.clone(this.state.stepDone); sd[st.id] = true;\n        setTimeout(() => this.setState({ stepDone: sd }, () => this.checkDone()), 2600);\n      }\n    });\n  }\n\n  runAction(key) {\n    if (key === \"mkApp\") {\n      const wt = this.clone(this.state.workingTree); wt[\"app.py\"] = this.APP_V1;\n      const idx = this.clone(this.state.index); idx[\"app.py\"] = this.APP_V1;\n      const seq = this.state.commitSeq + 1, hash = this.hashFor(seq);\n      const commits = this.clone(this.state.commits);\n      commits[hash] = { parents: this.state.branches[this.state.HEAD] ? [this.state.branches[this.state.HEAD]] : [], tree: this.clone(idx), msg: \"add app.py\", seq: seq };\n      const branches = this.clone(this.state.branches); branches[this.state.HEAD] = hash;\n      this.setState({ workingTree: wt, index: idx, commits: commits, commitSeq: seq, branches: branches, focusFile: \"app.py\" }, () => this.afterCmd());\n      this.print('<span style=\"color:#8a8f98\">[scenario] created and committed app.py<\u002Fspan>');\n      return;\n    }\n    if (key === \"messy\") {\n      const wt = this.clone(this.state.workingTree); wt[\"app.py\"] = this.APP_MESSY;\n      this.setState({ workingTree: wt, focusFile: \"app.py\" }, () => this.afterCmd());\n      this.print('<span style=\"color:#8a8f98\">[scenario] you ran the auto-formatter on app.py — reindented, plus one wording change. All unstaged in your working tree.<\u002Fspan>');\n      return;\n    }\n    if (key === \"teammate\") {\n      const wt = this.clone(this.state.workingTree); wt[\"app.py\"] = this.APP_TEAMMATE;\n      this.setState({ workingTree: wt, focusFile: \"app.py\" }, () => this.afterCmd());\n      this.print('<span style=\"color:#8a8f98\">[scenario] $ git apply teammate.patch — their edits are now unstaged in your working tree<\u002Fspan>');\n      return;\n    }\n    if (key === \"finish\") {\n      const sd = this.clone(this.state.stepDone); sd[\"p3k\"] = true;\n      this.setState({ stepDone: sd }, () => this.checkDone());\n    }\n  }\n\n  focusName() { return this.state.focusFile || Object.keys(this.state.workingTree)[0] || Object.keys(this.headTree())[0] || null; }\n  treeContent(tree, file) {\n    if (!file) return undefined;\n    if (tree === \"Working\") return this.state.workingTree[file];\n    if (tree === \"Staging\") return this.state.index[file];\n    return this.headTree()[file];\n  }\n  allFiles() {\n    return Array.from(new Set(Object.keys(this.state.workingTree).concat(Object.keys(this.state.index), Object.keys(this.headTree())))).sort();\n  }\n  openTree(tree) { const f = this.focusName(); if (f) this.setState({ treeModal: { tree: tree, file: f } }); }\n\n  launchConfetti() {\n    const canvas = document.createElement(\"canvas\");\n    canvas.style.cssText = \"position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;\";\n    document.body.appendChild(canvas);\n    const ctx = canvas.getContext(\"2d\"), dpr = window.devicePixelRatio || 1;\n    canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;\n    const colors = [\"#4af626\", \"#ffca28\", \"#ff5252\", \"#42a5f5\", \"#ff80ab\", \"#ffffff\"];\n    const ps = Array.from({ length: 180 }, () => ({ x: Math.random() * canvas.width, y: Math.random() * -canvas.height * 0.5, r: (Math.random() * 6 + 4) * dpr, c: colors[Math.floor(Math.random() * colors.length)], vx: (Math.random() - 0.5) * 4 * dpr, vy: (Math.random() * 3 + 2) * dpr, rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3 }));\n    const start = performance.now(), dur = 3500;\n    const tick = now => {\n      const t = now - start; ctx.clearRect(0, 0, canvas.width, canvas.height);\n      ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.05 * dpr; p.rot += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.max(0, 1 - t / dur); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6); ctx.restore(); });\n      if (t < dur) requestAnimationFrame(tick); else canvas.remove();\n    };\n    requestAnimationFrame(tick);\n  }\n\n  copyRaw(text, done) {\n    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(done);\n    else { const ta = document.createElement(\"textarea\"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand(\"copy\"); } catch (e) {} document.body.removeChild(ta); done(); }\n  }\n\n  buildViz(kind) {\n    const cap = t => '<p style=\"margin:16px 0 0; font-size:15px; line-height:1.65; color:#c7ccd4; font-family:sans-serif;\">' + t + \"<\u002Fp>\";\n    const wrap = (inner, h) => '<svg viewBox=\"0 0 560 ' + h + '\" width=\"100%\" style=\"background:#121212; border:1px solid #333; border-radius:10px; padding:8px;\">' + inner + \"<\u002Fsvg>\";\n    if (kind === \"p1\") {\n      const box = (x, label, sub, color) => '<rect x=\"' + x + '\" y=\"60\" width=\"140\" height=\"80\" rx=\"10\" fill=\"#1c1c1c\" stroke=\"' + color + '\" stroke-width=\"3\"><\u002Frect>' +\n        '<text x=\"' + (x + 70) + '\" y=\"95\" text-anchor=\"middle\" font-size=\"15\" font-family=\"monospace\" fill=\"' + color + '\" font-weight=\"bold\">' + label + \"<\u002Ftext>\" +\n        '<text x=\"' + (x + 70) + '\" y=\"120\" text-anchor=\"middle\" font-size=\"12\" font-family=\"monospace\" fill=\"#777\">' + sub + \"<\u002Ftext>\";\n      let s = box(20, \"Working\", \"your files\", \"#ff8a80\") + box(210, \"Staging\", \"git add\", \"#ffca28\") + box(400, \"HEAD\", \"last commit\", \"#4af626\");\n      s += '<path d=\"M160 175 L210 175\" stroke=\"#555\" stroke-width=\"2\"><\u002Fpath>';\n      s += '<line x1=\"90\" y1=\"160\" x2=\"90\" y2=\"185\" stroke=\"#42a5f5\" stroke-width=\"3\"><\u002Fline><line x1=\"280\" y1=\"160\" x2=\"280\" y2=\"185\" stroke=\"#42a5f5\" stroke-width=\"3\"><\u002Fline><line x1=\"90\" y1=\"185\" x2=\"280\" y2=\"185\" stroke=\"#42a5f5\" stroke-width=\"3\"><\u002Fline>';\n      s += '<text x=\"185\" y=\"205\" text-anchor=\"middle\" font-size=\"13\" font-family=\"monospace\" fill=\"#42a5f5\">git diff<\u002Ftext>';\n      s += '<line x1=\"280\" y1=\"225\" x2=\"280\" y2=\"245\" stroke=\"#ffca28\" stroke-width=\"3\"><\u002Fline><line x1=\"470\" y1=\"225\" x2=\"470\" y2=\"245\" stroke=\"#ffca28\" stroke-width=\"3\"><\u002Fline><line x1=\"280\" y1=\"245\" x2=\"470\" y2=\"245\" stroke=\"#ffca28\" stroke-width=\"3\"><\u002Fline>';\n      s += '<text x=\"375\" y=\"265\" text-anchor=\"middle\" font-size=\"13\" font-family=\"monospace\" fill=\"#ffca28\">git diff --staged<\u002Ftext>';\n      s += '<line x1=\"60\" y1=\"285\" x2=\"60\" y2=\"305\" stroke=\"#4af626\" stroke-width=\"3\"><\u002Fline><line x1=\"500\" y1=\"285\" x2=\"500\" y2=\"305\" stroke=\"#4af626\" stroke-width=\"3\"><\u002Fline><line x1=\"60\" y1=\"305\" x2=\"500\" y2=\"305\" stroke=\"#4af626\" stroke-width=\"3\"><\u002Fline>';\n      s += '<text x=\"280\" y=\"325\" text-anchor=\"middle\" font-size=\"13\" font-family=\"monospace\" fill=\"#4af626\">git diff HEAD<\u002Ftext>';\n      return wrap(s, 345) + cap(\"Three trees, three spans. <strong style=\\\"color:#42a5f5\\\">git diff<\u002Fstrong> = Working ↔ Staging. <strong style=\\\"color:#ffca28\\\">--staged<\u002Fstrong> = Staging ↔ HEAD. <strong style=\\\"color:#4af626\\\">HEAD<\u002Fstrong> = Working ↔ HEAD. When you stage a change, the first span closes — that's why <code>git diff<\u002Fcode> suddenly shows nothing.\");\n    }\n    if (kind === \"p2\") {\n      let s = '<text x=\"20\" y=\"45\" font-size=\"17\" font-family=\"monospace\" fill=\"#42a5f5\">@@ -12,7 +12,9 @@<\u002Ftext>';\n      s += '<line x1=\"60\" y1=\"60\" x2=\"60\" y2=\"105\" stroke=\"#ff8a80\" stroke-width=\"2\"><\u002Fline><text x=\"70\" y=\"102\" font-size=\"13\" font-family=\"monospace\" fill=\"#ff8a80\">old file: from line 12, 7 lines<\u002Ftext>';\n      s += '<line x1=\"175\" y1=\"60\" x2=\"175\" y2=\"135\" stroke=\"#7ee787\" stroke-width=\"2\"><\u002Fline><text x=\"185\" y=\"132\" font-size=\"13\" font-family=\"monospace\" fill=\"#7ee787\">new file: from line 12, 9 lines<\u002Ftext>';\n      s += '<rect x=\"20\" y=\"160\" width=\"520\" height=\"34\" rx=\"5\" fill=\"#3a1414\"><\u002Frect><text x=\"34\" y=\"183\" font-size=\"15\" font-family=\"monospace\" fill=\"#ff8a80\">- return \"Bye, \" + name<\u002Ftext>';\n      s += '<rect x=\"20\" y=\"200\" width=\"520\" height=\"34\" rx=\"5\" fill=\"#0f2915\"><\u002Frect><text x=\"34\" y=\"223\" font-size=\"15\" font-family=\"monospace\" fill=\"#7ee787\">+ return \"Goodbye, \" + name<\u002Ftext>';\n      s += '<text x=\"20\" y=\"268\" font-size=\"14\" font-family=\"monospace\" fill=\"#8a8f98\">with --word-diff:<\u002Ftext>';\n      s += '<text x=\"20\" y=\"296\" font-size=\"15\" font-family=\"monospace\" fill=\"#ccc\">return \"<tspan fill=\"#ff8a80\">[-Bye-]<\u002Ftspan><tspan fill=\"#7ee787\">{+Goodbye+}<\u002Ftspan>, \" + name<\u002Ftext>';\n      return wrap(s, 320) + cap(\"<code>-<\u002Fcode> is always the <strong>old<\u002Fstrong> side (<code>a/<\u002Fcode>), <code>+<\u002Fcode> the <strong>new<\u002Fstrong> (<code>b/<\u002Fcode>). A one-word edit still costs a full line removed and re-added — <strong>--word-diff<\u002Fstrong> narrows it to the words, and <strong>-w<\u002Fstrong> hides pure whitespace churn.\");\n    }\n    let s = '<circle cx=\"80\" cy=\"180\" r=\"18\" fill=\"#8a8f98\"><\u002Fcircle><text x=\"80\" y=\"216\" text-anchor=\"middle\" font-size=\"12\" font-family=\"monospace\" fill=\"#8a8f98\">base<\u002Ftext>';\n    s += '<path d=\"M98 180 L200 110\" stroke=\"#42a5f5\" stroke-width=\"4\"><\u002Fpath><circle cx=\"220\" cy=\"98\" r=\"18\" fill=\"#42a5f5\"><\u002Fcircle><text x=\"220\" y=\"70\" text-anchor=\"middle\" font-size=\"13\" font-family=\"monospace\" fill=\"#42a5f5\">feature (+Ciao)<\u002Ftext>';\n    s += '<path d=\"M98 180 L200 250\" stroke=\"#4af626\" stroke-width=\"4\"><\u002Fpath><circle cx=\"220\" cy=\"262\" r=\"18\" fill=\"#4af626\"><\u002Fcircle><text x=\"220\" y=\"298\" text-anchor=\"middle\" font-size=\"13\" font-family=\"monospace\" fill=\"#4af626\">main (+Hej)<\u002Ftext>';\n    s += '<line x1=\"300\" y1=\"60\" x2=\"300\" y2=\"300\" stroke=\"#333\" stroke-width=\"2\"><\u002Fline>';\n    s += '<text x=\"320\" y=\"105\" font-size=\"14\" font-family=\"monospace\" fill=\"#ffca28\">main..feature<\u002Ftext>';\n    s += '<text x=\"320\" y=\"130\" font-size=\"13\" font-family=\"monospace\" fill=\"#7ee787\">+ Ciao<\u002Ftext>';\n    s += '<text x=\"320\" y=\"152\" font-size=\"13\" font-family=\"monospace\" fill=\"#ff8a80\">− Hej &#160;&#160;← main\\'s own work!<\u002Ftext>';\n    s += '<text x=\"320\" y=\"215\" font-size=\"14\" font-family=\"monospace\" fill=\"#4af626\">main...feature<\u002Ftext>';\n    s += '<text x=\"320\" y=\"240\" font-size=\"13\" font-family=\"monospace\" fill=\"#7ee787\">+ Ciao<\u002Ftext>';\n    s += '<text x=\"320\" y=\"262\" font-size=\"13\" font-family=\"monospace\" fill=\"#8a8f98\">(what a PR shows)<\u002Ftext>';\n    return wrap(s, 320) + cap(\"<strong>Two dots<\u
