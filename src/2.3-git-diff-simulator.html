  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e10d1d1d-8d00-4000-9985-9dfa34e4360a\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  a { color: #1a7f37; }\n  a:hover { color: #146c2e; }\n  #term-scroll::-webkit-scrollbar, #side-scroll::-webkit-scrollbar { width: 10px; }\n  #term-scroll::-webkit-scrollbar-thumb, #side-scroll::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 5px; }\n  #lesson-scroll::-webkit-scrollbar { width: 10px; }\n  #lesson-scroll::-webkit-scrollbar-thumb { background: #d0d3d8; border-radius: 5px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"height:100vh; margin:0; background:#1e1e1e; color:#fff; font-family:'Courier New', Courier, monospace;\">\n\n  <sc-if value=\"{{ showVideo }}\" hint-placeholder-val=\"{{ true }}\">\n    <div id=\"lesson-scroll\" style=\"height:100vh; overflow-y:auto; background:#ffffff; display:flex; align-items:center; justify-content:center;\">\n      <div style=\"max-width:660px; margin:0 auto; padding:48px clamp(20px, 5vw, 56px); text-align:center;\">\n        <div style=\"color:#1a7f37; font-size:14px; letter-spacing:1px; margin-bottom:18px;\">STEP 0 · WATCH FIRST<\u002Fdiv>\n        <h1 style=\"font-size:38px; line-height:1.15; margin:0 0 18px; color:#1a1a1a;\">Start with a quick video<\u002Fh1>\n        <p style=\"font-size:18px; line-height:1.6; color:#555; margin:0 0 32px; font-family:sans-serif;\">Before the hands-on lesson, watch a short YouTube walkthrough on <strong style=\"color:#111;\">git diff<\u002Fstrong> — the working tree, the staging area, and how to read diff output. Head to YouTube and search:<\u002Fp>\n        <button sc-camel-on-click=\"{{ copyQuery }}\" title=\"Click to copy\" style=\"display:flex; align-items:center; gap:12px; width:100%; max-width:460px; margin:0 auto 20px; background:#f6f8fa; border:1px solid #e2e4e8; border-radius:999px; padding:14px 22px; text-align:left; cursor:pointer; font:inherit;\" style-hover=\"background:#eceff2\">\n          <span style=\"color:#999; font-size:18px;\">🔍<\u002Fspan>\n          <span style=\"flex:1; font-size:17px; color:#1a1a1a;\">git diff staged working tree tutorial<\u002Fspan>\n          <span style=\"font-size:12px; color:#999; letter-spacing:0.5px;\">{{ copyQueryLabel }}<\u002Fspan>\n        <\u002Fbutton>\n        <p style=\"font-size:15px; line-height:1.6; color:#777; margin:0 0 24px; font-family:sans-serif;\">Pick a highly-rated, recent video that clicks for you — 5–12 minutes is plenty. When it makes sense, come back and continue.<\u002Fp>\n        <a ref=\"{{ ytBtnRef }}\" href=\"https://www.youtube.com/results?search_query=git+diff+staged+working+tree+tutorial\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex; align-items:center; gap:10px; margin:0 auto 20px; background:#ff0000; color:#fff; border-radius:8px; padding:13px 24px; font-size:16px; font-weight:700; text-decoration:none; opacity:0.4; pointer-events:none; transition:opacity 0.35s ease;\" style-hover=\"background:#d90000\">\n          Open YouTube in a new tab\n          <sc-if value=\"{{ notCopied }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:15px;\">🔒<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ hasCopied }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:15px;\">↗︎<\u002Fspan><\u002Fsc-if>\n        <\u002Fa>\n        <div>\n          <button sc-camel-on-click=\"{{ goToIntro }}\" style=\"display:inline-flex; align-items:center; gap:10px; background:#1a1a1a; color:#fff; border:none; border-radius:8px; padding:16px 30px; font-size:17px; font-weight:700; font-family:'Courier New', Courier, monospace; cursor:pointer;\" style-hover=\"background:#333\">\n            I've watched it — continue →\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showIntro }}\" hint-placeholder-val=\"{{ false }}\">\n    <div id=\"lesson-scroll\" style=\"height:100vh; overflow-y:auto; background:#ffffff;\">\n      <div style=\"max-width:960px; margin:0 auto; padding:64px clamp(16px, 4vw, 48px) 96px;\">\n\n        <div style=\"margin-bottom:40px;\">\n          <div style=\"color:#1a7f37; font-size:14px; letter-spacing:1px; margin-bottom:16px;\">THE DIFF EXERCISE · GIT<\u002Fdiv>\n          <h1 style=\"font-size:44px; line-height:1.1; margin:0 0 16px; color:#1a1a1a;\">See exactly <span style=\"color:#1a7f37;\">what changed<\u002Fspan><\u002Fh1>\n          <p style=\"font-size:18px; line-height:1.6; color:#555; margin:0; max-width:700px;\">Most people think <code style=\"background:#f0f2f4; padding:2px 6px; border-radius:4px;\">git diff<\u002Fcode> is hard to <em>read<\u002Fem>. It isn't. The hard part is knowing <strong style=\"color:#111;\">which two snapshots<\u002Fstrong> you just compared. Get that right and the rest is easy.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff8e6; border:1px solid #f0d999; border-radius:10px; padding:24px 28px; margin-bottom:24px;\">\n          <p style=\"margin:0; font-size:16px; line-height:1.65; color:#5c4700;\"><strong>Before each diff, you'll be asked to predict the output.<\u002Fstrong> You can't run the command until you commit to an answer. That's the whole point — guessing wrong once teaches more than reading ten correct diffs.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:24px;\">\n          <div style=\"background:#f6f8fa; border:1px solid #e2e4e8; border-radius:10px; padding:22px 24px;\">\n            <div style=\"font-size:13px; color:#9a6700; margin-bottom:10px;\">PART 1<\u002Fdiv>\n            <h3 style=\"margin:0 0 8px; font-size:17px; color:#1a1a1a; font-family:sans-serif;\">Which two snapshots?<\u002Fh3>\n            <p style=\"margin:0 0 14px; font-size:14px; line-height:1.6; color:#555; font-family:sans-serif;\">Working tree, staging area, HEAD. Learn why <code>git diff<\u002Fcode> goes silent right after you stage — the moment that confuses everyone.<\u002Fp>\n            <div style=\"font-size:13px; color:#4af626; background:#121212; border-radius:6px; padding:10px 12px;\">git diff --staged<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ vizP1 }}\" style=\"margin-top:10px; width:100%; background:transparent; color:#1a7f37; border:1px solid #1a7f37; border-radius:6px; padding:9px 12px; font-size:13px; font-family:sans-serif; font-weight:600; cursor:pointer;\" style-hover=\"background:#e8f3ea\">▶ Visualize the trees<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"background:#f6f8fa; border:1px solid #e2e4e8; border-radius:10px; padding:22px 24px;\">\n            <div style=\"font-size:13px; color:#9a6700; margin-bottom:10px;\">PART 2<\u002Fdiv>\n            <h3 style=\"margin:0 0 8px; font-size:17px; color:#1a1a1a; font-family:sans-serif;\">Read it like a pro<\u002Fh3>\n            <p style=\"margin:0 0 14px; font-size:14px; line-height:1.6; color:#555; font-family:sans-serif;\">Decode the <code>@@<\u002Fcode> header, and beat the two traps: whitespace noise and one-word edits that look like rewrites.<\u002Fp>\n            <div style=\"font-size:13px; color:#4af626; background:#121212; border-radius:6px; padding:10px 12px;\">git diff -w --word-diff<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ vizP2 }}\" style=\"margin-top:10px; width:100%; background:transparent; color:#1a7f37; border:1px solid #1a7f37; border-radius:6px; padding:9px 12px; font-size:13px; font-family:sans-serif; font-weight:600; cursor:pointer;\" style-hover=\"background:#e8f3ea\">▶ Visualize the anatomy<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"background:#f6f8fa; border:1px solid #e2e4e8; border-radius:10px; padding:22px 24px;\">\n            <div style=\"font-size:13px; color:#9a6700; margin-bottom:10px;\">PART 3<\u002Fdiv>\n            <h3 style=\"margin:0 0 8px; font-size:17px; color:#1a1a1a; font-family:sans-serif;\">The real workflow<\u002Fh3>\n            <p style=\"margin:0 0 14px; font-size:14px; line-height:1.6; color:#555; font-family:sans-serif;\">Catch a secret before you commit it, review a branch the way a PR does, and find the commit that broke things.<\u002Fp>\n            <div style=\"font-size:13px; color:#4af626; background:#121212; border-radius:6px; padding:10px 12px;\">git diff main...feature<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ vizP3 }}\" style=\"margin-top:10px; width:100%; background:transparent; color:#1a7f37; border:1px solid #1a7f37; border-radius:6px; padding:9px 12px; font-size:13px; font-family:sans-serif; font-weight:600; cursor:pointer;\" style-hover=\"background:#e8f3ea\">▶ Visualize two-dot vs three-dot<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#121212; border:1px solid #333; border-radius:10px; padding:24px 28px; margin-bottom:40px; font-size:14px; line-height:1.8;\">\n          <div style=\"color:#666; margin-bottom:8px;\"># the terminal runs a real diff engine — these all work<\u002Fdiv>\n          <div><span style=\"color:#4af626;\">git diff<\u002Fspan> · <span style=\"color:#4af626;\">git diff --staged<\u002Fspan> · <span style=\"color:#4af626;\">git diff HEAD<\u002Fspan> · <span style=\"color:#4af626;\">git diff HEAD~2 HEAD<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#4af626;\">git diff main..feature<\u002Fspan> · <span style=\"color:#4af626;\">git diff main...feature<\u002Fspan> · <span style=\"color:#4af626;\">git diff -- app.py<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#4af626;\">-w<\u002Fspan> · <span style=\"color:#4af626;\">--word-diff<\u002Fspan> · <span style=\"color:#4af626;\">--stat<\u002Fspan> · <span style=\"color:#4af626;\">--name-status<\u002Fspan> · <span style=\"color:#4af626;\">--check<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <button sc-camel-on-click=\"{{ openSimulator }}\" style=\"display:inline-flex; align-items:center; gap:10px; background:#4af626; color:#0a0a0a; border:none; border-radius:8px; padding:16px 28px; font-size:17px; font-weight:700; font-family:'Courier New', Courier, monospace; cursor:pointer;\" style-hover=\"background:#3ad61c\">\n          Open Simulator Terminal →\n        <\u002Fbutton>\n        <p style=\"margin:16px 0 0; font-size:14px; color:#888; font-family:sans-serif;\">The panel on the right shows all three trees live, so you can always see what you're comparing.<\u002Fp>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showSim }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex; height:100vh;\">\n\n      <div id=\"term-scroll\" ref=\"{{ terminalRef }}\" sc-camel-on-click=\"{{ focusInput }}\" style=\"flex:2; background:#121212; padding:20px 22px; font-size:14.5px; overflow-y:auto; position:relative;\">\n        {{ historyEl }}\n        <sc-if value=\"{{ terminalMode }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex; gap:8px; align-items:baseline;\">\n            <span style=\"color:#4af626; white-space:nowrap;\">{{ prompt }}<\u002Fspan>\n            <input ref=\"{{ inputRef }}\" type=\"text\" autocomplete=\"off\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\" value=\"{{ cmd }}\" sc-camel-on-change=\"{{ onChange }}\" sc-camel-on-key-down=\"{{ onKeyDown }}\" style=\"background:transparent; border:none; color:#fff; font-family:'Courier New', Courier, monospace; font-size:14.5px; outline:none; flex:1;\">\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ vimShown }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute; top:0; left:0; right:0; bottom:0; background:#121212; padding:20px; display:flex; flex-direction:column; z-index:10;\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; min-height:34px; flex-wrap:wrap;\">\n              <span style=\"color:#666; font-size:13px;\">{{ vimFileLabel }}<\u002Fspan>\n              <div style=\"display:flex; align-items:center; gap:8px; flex-wrap:wrap;\">\n                <sc-if value=\"{{ vimInsertMode }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button sc-camel-on-click=\"{{ escToNormal }}\" style=\"background:#252526; color:#ffca28; border:1px solid #ffca28; border-radius:6px; padding:6px 12px; font-size:13px; font-family:'Courier New', Courier, monospace; cursor:pointer;\" style-hover=\"background:#1a1a1a\">⎋ Esc — done typing<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ vimNormalMode }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button sc-camel-on-click=\"{{ writeQuit }}\" style=\"background:#4af626; color:#0a0a0a; border:none; border-radius:6px; padding:6px 12px; font-size:13px; font-weight:700; font-family:'Courier New', Courier, monospace; cursor:pointer;\" style-hover=\"background:#3ad61c\">:wq — save &amp; quit<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <textarea ref=\"{{ vimTextRef }}\" sc-camel-read-only=\"{{ vimReadonly }}\" value=\"{{ vimText }}\" sc-camel-on-change=\"{{ onVimTextChange }}\" sc-camel-on-key-down=\"{{ onVimKeyDown }}\" style=\"flex-grow:1; background:transparent; border:none; color:#fff; font-family:'Courier New', Courier, monospace; font-size:14px; line-height:1.4; outline:none; resize:none; white-space:pre;\"><\u002Ftextarea>\n            <div style=\"display:flex; justify-content:space-between; height:22px; font-weight:bold;\">\n              <span style=\"color:#4af626;\">{{ vimStatusLeft }}<\u002Fspan>\n              <span style=\"color:#fff;\">{{ vimCommand }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div id=\"side-scroll\" style=\"flex:1; min-width:380px; max-width:500px; background:#252526; padding:20px 22px; border-left:2px solid #333; display:flex; flex-direction:column; gap:14px; overflow-y:auto;\">\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n          <button sc-camel-on-click=\"{{ backToIntro }}\" style=\"background:transparent; color:#888; border:1px solid #333; border-radius:6px; padding:8px 14px; font-size:13px; font-family:'Courier New', Courier, monospace; cursor:pointer;\" style-hover=\"color:#ccc\">🏠 Home<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ resetSim }}\" style=\"background:transparent; color:#888; border:1px solid #333; border-radius:6px; padding:8px 14px; font-size:13px; font-family:'Courier New', Courier, monospace; cursor:pointer;\" style-hover=\"color:#ccc\">↺ Reset repo<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"background:#1c1c1c; border:1px solid #333; border-radius:8px; padding:14px 16px;\">\n          <div style=\"color:#666; font-size:12px; letter-spacing:1px; margin-bottom:12px;\">YOUR THREE GOALS<\u002Fdiv>\n          {{ goalsEl }}\n        <\u002Fdiv>\n\n        <div style=\"background:#1c1c1c; border:1px solid #333; border-radius:8px; padding:14px 16px;\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;\">\n            <span style=\"color:#666; font-size:12px; letter-spacing:1px;\">THE THREE TREES<\u002Fspan>\n            <span style=\"color:#555; font-size:11px;\">{{ focusFileLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          {{ treesEl }}\n        <\u002Fdiv>\n\n        {{ predictEl }}\n\n        <div style=\"background:#333; padding:18px 20px; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,0.3);\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;\">\n            <h2 style=\"margin:0; color:#4af626; font-size:17px;\">{{ guideTitle }}<\u002Fh2>\n            <span style=\"color:#888; font-size:12px; white-space:nowrap;\">{{ stepBadge }}<\u002Fspan>\n          <\u002Fdiv>\n          {{ guideBodyEl }}\n          {{ actionEl }}\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; bottom:32px; left:50%; transform:translateX(-50%); background:#1a1a1a; color:#fff; padding:14px 22px; border-radius:8px; font-family:'Courier New', Courier, monospace; font-size:15px; box-shadow:0 8px 24px rgba(0,0,0,0.25); z-index:1000; display:flex; align-items:center; gap:10px;\">\n      <span style=\"color:#4af626;\">✓<\u002Fspan> {{ toastMsg }}\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ recordModal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeRecordModal }}\" style=\"position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:2000; display:flex; align-items:center; justify-content:center; padding:24px;\">\n      <div sc-camel-on-click=\"{{ stopProp }}\" style=\"background:#1e1e1e; border:1px solid #333; border-radius:14px; max-width:540px; width:100%; padding:36px 38px; box-shadow:0 20px 60px rgba(0,0,0,0.5); color:#e2e4e8;\">\n        <div style=\"display:flex; align-items:center; gap:10px; color:#ff5252; font-family:'Courier New', Courier, monospace; font-size:14px; letter-spacing:1px; margin-bottom:16px;\">\n          <span style=\"width:11px; height:11px; border-radius:50%; background:#ff5252; box-shadow:0 0 0 4px rgba(255,82,82,0.18);\"><\u002Fspan>\n          REC · BEFORE YOU START\n        <\u002Fdiv>\n        <h2 style=\"margin:0 0 16px; font-size:26px; line-height:1.2; color:#fff; font-family:'Courier New', Courier, monospace;\">Record your screen as you go<\u002Fh2>\n        <p style=\"margin:0 0 14px; font-size:16px; line-height:1.65; color:#c7ccd4; font-family:sans-serif;\">Start a screen recording now and create a short tutorial video walking through this simulator. As you complete each part, <strong style=\"color:#fff;\">say out loud what you're doing and why<\u002Fstrong> — especially <em>which two snapshots<\u002Fem> each diff is comparing.<\u002Fp>\n        <p style=\"margin:0 0 24px; font-size:16px; line-height:1.65; color:#c7ccd4; font-family:sans-serif;\">It doesn't need to be perfectly polished or articulate — as long as you get through the exercise and can generate the answer. When you're done, <strong style=\"color:#fff;\">override the existing answer and upload it to the Wiz platform<\u002Fstrong> so future people can reference it.<\u002Fp>\n        <div style=\"display:flex; gap:12px; flex-wrap:wrap;\">\n          <button sc-camel-on-click=\"{{ confirmRecord }}\" style=\"flex:1; min-width:200px; background:#4af626; color:#0a0a0a; border:none; border-radius:8px; padding:15px 24px; font-size:16px; font-weight:700; font-family:'Courier New', Courier, monospace; cursor:pointer;\" style-hover=\"background:#3ad61c\">🔴 I'm recording — start →<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeRecordModal }}\" style=\"background:transparent; color:#888; border:1px solid #333; border-radius:8px; padding:15px 20px; font-size:15px; font-family:'Courier New', Courier, monospace; cursor:pointer;\" style-hover=\"color:#ccc\">Not yet<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showViz }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeViz }}\" style=\"position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2500; display:flex; align-items:center; justify-content:center; padding:24px;\">\n      <div sc-camel-on-click=\"{{ stopProp }}\" style=\"background:#1e1e1e; border:1px solid #333; border-radius:14px; max-width:640px; width:100%; padding:30px 34px; box-shadow:0 20px 60px rgba(0,0,0,0.5); color:#e2e4e8; max-height:88vh; overflow-y:auto;\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px;\">\n          <h2 style=\"margin:0; font-size:22px; color:#4af626; font-family:'Courier New', Courier, monospace;\">{{ vizTitle }}<\u002Fh2>\n          <button sc-camel-on-click=\"{{ closeViz }}\" style=\"background:transparent; color:#888; border:1px solid #333; border-radius:6px; padding:7px 13px; font-size:14px; font-family:'Courier New', Courier, monospace; cursor:pointer;\" style-hover=\"color:#ccc\">✕ Close<\u002Fbutton>\n        <\u002Fdiv>\n        {{ vizEl }}\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showTreeModal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeTreeModal }}\" style=\"position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:2600; display:flex; align-items:center; justify-content:center; padding:24px;\">\n      <div sc-camel-on-click=\"{{ stopProp }}\" style=\"background:#1e1e1e; border:1px solid #333; border-radius:14px; max-width:680px; width:100%; max-height:86vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.55); color:#e2e4e8;\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; padding:22px 26px 0;\">\n          <h2 style=\"margin:0; font-size:19px; color:#4af626; font-family:'Courier New', Courier, monospace;\">{{ treeModalFile }}<\u002Fh2>\n          <button sc-camel-on-click=\"{{ closeTreeModal }}\" style=\"background:transparent; color:#888; border:1px solid #333; border-radius:6px; padding:7px 13px; font-size:14px; font-family:'Courier New', Courier, monospace; cursor:pointer;\" style-hover=\"color:#ccc\">✕ Close<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding:16px 26px 0;\">{{ treeTabsEl }}<\u002Fdiv>\n        <div style=\"padding:0 26px;\">{{ treeFilesEl }}<\u002Fdiv>\n        <div style=\"padding:0 26px 24px; overflow-y:auto;\">{{ treeModalBodyEl }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  \n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.terminalRef = React.createRef();\n    this.inputRef = React.createRef();\n    this.ytBtnRef = React.createRef();\n    this.vimTextRef = React.createRef();\n    this.vimCmd = \"\";\n\n    this.APP_V1 = 'class Greeter:\\n    def __init__(self, name):\\n        self.name = name\\n\\n    def greet(self):\\n        return \"Hello, \" + self.name\\n\\n    def farewell(self):\\n        return \"Bye, \" + self.name';\n    // reindented 4 spaces -> 2 everywhere + ONE real change (Bye -> Goodbye)\n    this.APP_MESSY = 'class Greeter:\\n  def __init__(self, name):\\n    self.name = name\\n\\n  def greet(self):\\n    return \"Hello, \" + self.name\\n\\n  def farewell(self):\\n    return \"Goodbye, \" + self.name';\n    this.APP_TEAMMATE = 'API_KEY = \"sk_live_51H8xQ2eZvKYlo2CqRtN\"\\n\\nclass Greeter:\\n  def __init__(self, name):\\n    self.name = name\\n\\n  def greet(self):\\n    print(\"DEBUG: greeting\", self.name)\\n    return \"Hello, \" + self.name.strip()\\n\\n  def farewell(self):\\n    return \"Goodbye, \" + self.name';\n\n    this.state = this.freshState();\n  }\n\n  freshState() {\n    return {\n      view: \"video\",\n      copied: false, toast: false, toastMsg: \"\", recordModal: false, vizModal: null,\n      history: [\n        \"Simulated shell running a <span style=\\\"color:#4af626\\\">real diff engine<\u002Fspan>.\",\n        \"Follow the guide on the right. Predictions are required before each diff.\"\n      ],\n      cmd: \"\", mode: \"terminal\",\n      vimFile: null, vimText: \"\", vimReadonly: true, vimStatusLeft: \"\", vimCommand: \"\",\n      repoInit: false,\n      workingTree: {}, index: {},\n      branches: {}, HEAD: null, commits: {}, commitSeq: 0,\n      focusFile: null,\n      lastSpan: null,\n      stepDone: {}, predictAns: {}, predictOK: {}, treeModal: null,\n      committedSecret: false, secretCaught: false,\n      confettiFired: false, _guideHint: null\n    };\n  }\n\n  componentDidUpdate(prevProps, prevState) {\n    const t = this.terminalRef.current;\n    if (t) { if (this.state.mode !== \"terminal\") t.scrollTop = 0; else t.scrollTop = t.scrollHeight; }\n    if (this.state.view === \"sim\" && (!prevState || prevState.view !== \"sim\") && this.inputRef.current) this.inputRef.current.focus();\n  }\n  componentWillUnmount() { document.removeEventListener(\"keydown\", this.vimKeyListener); }\n\n  // ================= helpers =================\n  escape(s) { return String(s).replace(/&/g, \"&amp;\").replace(/<\u002Fg, \"&lt;\").replace(/>/g, \"&gt;\"); }\n  hl(c) { return '<span style=\"color:#ffca28;font-weight:bold\">' + c + \"<\u002Fspan>\"; }\n  print(html) { this.setState(s => ({ history: [...s.history, html] })); }\n  clone(o) { return Object.assign({}, o); }\n  hashFor(seq) { return (0xc0ffee + seq * 0x3b9f27).toString(16).slice(-7); }\n  toLines(c) { return (c === undefined || c === null || c === \"\") ? [] : c.split(\"\\n\"); }\n  stripQuotes(s) { s = s.trim(); if ((s[0] === '\"' && s.slice(-1) === '\"') || (s[0] === \"'\" && s.slice(-1) === \"'\")) return s.slice(1, -1); return s; }\n  headTree() { const t = this.state.branches[this.state.HEAD]; return t ? this.state.commits[t].tree : {}; }\n  prompt() { return \"dev@wiz:~/project\" + (this.state.repoInit ? \" (\" + this.state.HEAD + \")\" : \"\") + \"$\"; }\n  treesEqual(a, b) { const ak = Object.keys(a), bk = Object.keys(b); return ak.length === bk.length && ak.every(k => b[k] === a[k]); }\n\n  // ================= diff engine =================\n  lcsPairs(a, b) {\n    const m = a.length, n = b.length;\n    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));\n    for (let i = m - 1; i >= 0; i--)\n      for (let j = n - 1; j >= 0; j--)\n        dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);\n    const res = []; let i = 0, j = 0;\n    while (i < m && j < n) {\n      if (a[i] === b[j]) { res.push([i, j]); i++; j++; }\n      else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;\n    }\n    return res;\n  }\n  normWS(l) { return l.replace(/\\s+/g, \"\"); }\n\n  diffOps(A, B, ignoreWS) {\n    const a = ignoreWS ? A.map(l => this.normWS(l)) : A;\n    const b = ignoreWS ? B.map(l => this.normWS(l)) : B;\n    const pairs = this.lcsPairs(a, b).concat([[A.length, B.length]]);\n    const ops = []; let ai = 0, bi = 0;\n    for (const p of pairs) {\n      const ma = p[0], mb = p[1];\n      for (let i = ai; i < ma; i++) ops.push({ t: \"-\", line: A[i] });\n      for (let j = bi; j < mb; j++) ops.push({ t: \"+\", line: B[j] });\n      if (ma < A.length) ops.push({ t: \" \", line: A[ma] });\n      ai = ma + 1; bi = mb + 1;\n    }\n    let o = 0, n = 0;\n    ops.forEach(op => { op.o = o; op.n = n; if (op.t === \" \") { o++; n++; } else if (op.t === \"-\") o++; else n++; });\n    return ops;\n  }\n\n  hunksFrom(ops, ctx) {\n    const changed = []; ops.forEach((op, i) => { if (op.t !== \" \") changed.push(i); });\n    if (!changed.length) return [];\n    const groups = []; let start = changed[0], prev = changed[0];\n    for (let k = 1; k < changed.length; k++) {\n      if (changed[k] - prev > ctx * 2) { groups.push([start, prev]); start = changed[k]; }\n      prev = changed[k];\n    }\n    groups.push([start, prev]);\n    return groups.map(g => {\n      const s = Math.max(0, g[0] - ctx), e = Math.min(ops.length - 1, g[1] + ctx);\n      const slice = ops.slice(s, e + 1);\n      const oldCount = slice.filter(x => x.t === \" \" || x.t === \"-\").length;\n      const newCount = slice.filter(x => x.t === \" \" || x.t === \"+\").length;\n      return {\n        slice: slice,\n        oldStart: oldCount === 0 ? slice[0].o : slice[0].o + 1,\n        oldCount: oldCount,\n        newStart: newCount === 0 ? slice[0].n : slice[0].n + 1,\n        newCount: newCount\n      };\n    });\n  }\n\n  rangeFmt(s, c) { return c === 1 ? String(s) : s + \",\" + c; }\n\n  wordDiff(oldText, newText) {\n    const tok = t => t.split(/(\\s+)/).filter(x => x !== \"\");\n    const A = tok(oldText), B = tok(newText);\n    const pairs = this.lcsPairs(A, B).concat([[A.length, B.length]]);\n    let out = \"\"; let ai = 0, bi = 0;\n    for (const p of pairs) {\n      const ma = p[0], mb = p[1];\n      let del = \"\", add = \"\";\n      for (let i = ai; i < ma; i++) del += A[i];\n      for (let j = bi; j < mb; j++) add += B[j];\n      if (del) out += '<span style=\"color:#ff8a80;background:#3a1414\">[-' + this.escape(del) + \"-]<\u002Fspan>\";\n      if (add) out += '<span style=\"color:#7ee787;background:#0f2915\">{+' + this.escape(add) + \"+}<\u002Fspan>\";\n      if (ma < A.length) out += this.escape(A[ma]);\n      ai = ma + 1; bi = mb + 1;\n    }\n    return out;\n  }\n\n  renderFileDiff(name, oldC, newC, opts) {\n    if (oldC === newC) return \"\";\n    const A = this.toLines(oldC), B = this.toLines(newC);\n    const ops = this.diffOps(A, B, opts.ignoreWS);\n    const hunks = this.hunksFrom(ops, 3);\n    if (!hunks.length) return \"\";\n    const gray = t => '<span style=\"color:#8a8f98\">' + t + \"<\u002Fspan>\";\n    let out = '<span style=\"color:#fff;font-weight:bold\">diff --git a/' + name + \" b/\" + name + \"<\u002Fspan>\\n\";\n    if (oldC === undefined) out += gray(\"new file mode 100644\") + \"\\n\" + gray(\"--- /dev/null\") + \"\\n\" + gray(\"+++ b/\" + name) + \"\\n\";\n    else if (newC === undefined) out += gray(\"deleted file mode 100644\") + \"\\n\" + gray(\"--- a/\" + name) + \"\\n\" + gray(\"+++ /dev/null\") + \"\\n\";\n    else out += gray(\"--- a/\" + name) + \"\\n\" + gray(\"+++ b/\" + name) + \"\\n\";\n\n    hunks.forEach(h => {\n      out += '<span style=\"color:#42a5f5\">@@ -' + this.rangeFmt(h.oldStart, h.oldCount) + \" +\" + this.rangeFmt(h.newStart, h.newCount) + \" @@<\u002Fspan>\\n\";\n      if (opts.word) {\n
