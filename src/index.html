<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JACGITDOJO</title>
<style>
  :root {
    --sidebar-w: 260px;
    --text-primary: #222;
    --text-secondary: #666;
    --text-muted: #999;
    --border-color: #ddd;
    --hover-bg: #f5f5ff;
    --badge-text: #966;
    --badge-border: #ecd;
    --note-text: #a60;
    --surface-bg: #fafafa;
    --content-bg: #fff;
    --active-nav-bg: #e8e8ff;
    --link-color: #0066cc;
    --hint-bg: #f5f5f5;
    --hint-code-bg: #f0f0f0;
    /* Brand: darkened for contrast against the light background */
    --brand-accent: #128149;
    --brand-mid: #1b2b20;
  }

  html[data-theme="dark"] {
    --text-primary: #e8e8e8;
    --text-secondary: #aaa;
    --text-muted: #888;
    --border-color: #444;
    --hover-bg: #3a3a40;
    --badge-text: #d99;
    --note-text: #d89;
    --surface-bg: #2b2b30;
    --content-bg: #1f1f23;
    --active-nav-bg: #3f3f55;
    --link-color: #66b3ff;
    --hint-bg: #242428;
    --hint-code-bg: #2a2a2e;
    /* Brand: the reference palette */
    --brand-accent: #3ddc84;
    --brand-mid: #e8f0ea;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-primary);
    background-color: var(--content-bg);
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border-color);
    background: var(--surface-bg);
    height: 56px;
    flex-shrink: 0;
    transition: background-color 0.25s ease;
  }

  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
  }

  .top-bar-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    white-space: nowrap;
    transition: color 0.25s ease;
  }

  .brand-face {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    fill: none;
    stroke: var(--brand-accent);
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.25s ease;
  }

  .brand-face .eye {
    fill: var(--brand-accent);
    stroke: none;
    transition: fill 0.25s ease;
  }

  .brand-accent { color: var(--brand-accent); }
  .brand-mid    { color: var(--brand-mid); }

  .layout {
    display: grid;
    grid-template-rows: 56px 1fr;
    grid-template-columns: 1fr;
    height: 100vh;
    gap: 0;
    transition: grid-template-rows 0.25s ease;
  }

  .layout-content-area {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    height: 100%;
    gap: 0;
    transition: grid-template-columns 0.25s ease;
  }

  .layout.sidebar-collapsed .layout-content-area {
    grid-template-columns: 0 1fr;
  }

  .layout.sidebar-collapsed .sidebar {
    overflow: hidden;
    border-right: none;
  }

  .sidebar {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border-color);
    background: var(--surface-bg);
    overflow-y: auto;
    transition: background-color 0.25s ease;
  }

  .sidebar-title {
    display: none;
  }

  #nav-root {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 0;
  }

  .nav-group-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin: 1rem 1rem 0.5rem;
    font-weight: 600;
  }

  .nav-group-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .nav-item {
    margin: 0;
  }

  .nav-link {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    margin: 0 0.5rem;
    border-radius: 6px;
    text-decoration: none;
    color: var(--text-primary);
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  .nav-link:hover {
    background-color: var(--hover-bg);
  }

  .nav-link.active {
    background-color: var(--active-nav-bg);
    font-weight: 600;
    transition: background-color 0.15s ease;
  }

  .nav-label {
    flex: 1;
    min-width: 0;
    word-break: break-word;
  }

  .badge {
    display: inline-flex;
    color: var(--badge-text);
    cursor: help;
    flex-shrink: 0;
  }

  .badge svg {
    width: 14px;
    height: 14px;
  }

  .nav-note {
    display: block;
    font-size: 0.7rem;
    color: var(--note-text);
    padding: 0.25rem 0.75rem 0;
    margin-top: -0.25rem;
    font-weight: normal;
  }

  .sidebar-footer {
    padding: 1rem;
    border-top: 1px solid var(--border-color);
    font-size: 0.75rem;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  .content {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .content-header {
    display: none;
  }

  .content-title {
    display: none;
  }

  .open-tab-link {
    color: var(--link-color);
    text-decoration: none;
    font-size: 0.9rem;
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .open-tab-link:hover {
    background-color: var(--hover-bg);
  }

  #viewer {
    flex: 1;
    border: none;
    width: 100%;
    background: var(--content-bg);
    transition: background-color 0.25s ease;
  }

  #viewer[hidden] {
    display: none;
  }

  /* Placeholder shown in the viewer area until a mission is picked */
  #empty-state {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(0.75rem, 2vw, 1.4rem);
    padding: clamp(1rem, 4vw, 2.5rem);
    text-align: center;
    background: var(--content-bg);
    transition: background-color 0.25s ease;
  }

  #empty-state[hidden] {
    display: none;
  }

  #empty-state p {
    margin: 0;
    max-width: 22ch;
    font-size: clamp(1.05rem, 2.4vw, 1.65rem);
    font-weight: 600;
    line-height: 1.35;
    color: var(--text-primary);
    transition: color 0.25s ease;
  }

  .empty-face {
    width: clamp(52px, 8vw, 96px);
    height: clamp(52px, 8vw, 96px);
    flex-shrink: 0;
    fill: none;
    stroke: var(--brand-accent);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.25s ease;
  }

  .empty-face .eye {
    fill: var(--brand-accent);
    stroke: none;
    transition: fill 0.25s ease;
  }

  .hint {
    font-size: 0.75rem;
    color: var(--text-secondary);
    padding: 0.75rem 1rem;
    border-top: 1px solid var(--border-color);
    background: var(--hint-bg);
    line-height: 1.4;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  .hint code {
    background: var(--hint-code-bg);
    padding: 0.2rem 0.4rem;
    border-radius: 3px;
    font-family: monospace;
    transition: background-color 0.25s ease;
  }

  /* Responsive: stack layout on narrow viewports */
  @media (max-width: 700px) {
    .layout-content-area {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
    }

    .layout.sidebar-collapsed .layout-content-area {
      grid-template-rows: 0 1fr;
    }

    .layout.sidebar-collapsed .sidebar {
      border-bottom: none;
      border-right: none;
    }

    .sidebar {
      max-height: 35vh;
      border-right: none;
      border-bottom: 1px solid var(--border-color);
    }

    .content-header {
      flex-direction: column;
      align-items: flex-start;
    }

    .open-tab-link {
      align-self: flex-start;
    }

    .top-bar-title {
      display: none;
    }
  }

  .icon-toggle {
    background: none;
    border: none;
    padding: 0.5rem;
    cursor: pointer;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 0.25rem;
    font-size: 1rem;
    border-radius: 4px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .icon-toggle:hover {
    background-color: var(--hover-bg);
  }

  .icon-toggle svg {
    width: 20px;
    height: 20px;
  }
</style>
</head>
<body>

<div class="layout">
  <div class="top-bar">
    <div class="top-bar-left">
      <button id="sidebar-toggle" class="icon-toggle" aria-expanded="true" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>
      <h1 class="top-bar-title">
        <svg class="brand-face" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5"/>
          <circle class="eye" cx="8.6" cy="9.6" r="1.25"/>
          <circle class="eye" cx="15.4" cy="9.6" r="1.25"/>
          <path d="M7.4 14.3c1.2 1.7 2.8 2.6 4.6 2.6s3.4-.9 4.6-2.6"/>
        </svg>
        <span><span class="brand-accent">JAC</span><span class="brand-mid">GIT</span><span class="brand-accent">DOJO</span></span>
      </h1>
    </div>
    <div style="flex: 1;"></div>
    <a id="open-new-tab-icon" href="#" target="_blank" rel="noopener" class="icon-toggle" style="display:none;" aria-label="Open in new tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
    </a>
    <button id="theme-toggle" class="icon-toggle" aria-pressed="true" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <a id="github-link" href="https://github.com/zunit/git-simulator.git" target="_blank" rel="noopener" class="icon-toggle" aria-label="View source on GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v 3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
      </svg>
    </a>
  </div>

  <div class="layout-content-area">
    <nav class="sidebar">
      <h1 class="sidebar-title">JACGITDOJO</h1>
      <div id="nav-root"></div>
    </nav>

    <main class="content">
      <div class="content-header">
        <div class="content-title" id="current-title">Select a simulator from the sidebar</div>
      </div>
      <div id="empty-state">
        <svg class="empty-face" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5"/>
          <circle class="eye" cx="8.6" cy="9.6" r="1.25"/>
          <circle class="eye" cx="15.4" cy="9.6" r="1.25"/>
          <path d="M7.4 14.3c1.2 1.7 2.8 2.6 4.6 2.6s3.4-.9 4.6-2.6"/>
        </svg>
        <p>Select a Git mission and start practicing</p>
      </div>
      <iframe id="viewer" title="Simulator viewer" src="about:blank" hidden></iframe>
    </main>
  </div>
</div>

<script>
  // Restore sidebar state before render to avoid flash
  const layout = document.querySelector('.layout');
  const isCollapsed = localStorage.getItem('git-sim-sidebar-collapsed') === 'true';
  if (isCollapsed) {
    layout.classList.add('sidebar-collapsed');
  }

  // Restore theme state before render to avoid flash
  const html = document.documentElement;
  const savedTheme = localStorage.getItem('git-sim-theme') || 'dark';
  html.dataset.theme = savedTheme;

  // Sync toggle button aria-pressed to match restored theme
  const themeToggleBtn = document.getElementById('theme-toggle');
  if (themeToggleBtn) {
    themeToggleBtn.setAttribute('aria-pressed', savedTheme === 'dark');
  }

  const WIFI_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M5 12.55a11 11 0 0 1 14 0"/>
    <path d="M8.5 16.05a6 6 0 0 1 7 0"/>
    <line x1="12" y1="20" x2="12.01" y2="20"/>
  </svg>`;

  const NAV = [
    {
      group: "1 · Git Basics",
      items: [
        { file: "1_2-git-amend-simulator-overview.html", label: "Git Commit (Amend)", cdn: true },
        { file: "1_3-git-log-simulation.html",            label: "Git Log",            cdn: false },
        { file: "1_4-git-ignore-simulator.html",          label: "Git Ignore",         cdn: true },
        { file: "1_5-git-stash-simulator.html",           label: "Git Stash",          cdn: true },
        { file: "1_6-git-time-machine.html",              label: "Git Time Machine",   cdn: true },
      ],
    },
    {
      group: "2 · Git Intermediate",
      items: [
        {
          file: "2_1-git-branching-simulator-non-wiz-staff.html",
          label: "Git Branching",
          cdn: true,
        },
        { file: "2_2-git-merging-simulator.html",             label: "Branch Merging",                 cdn: true },
        { file: "2_3-git-diff-simulator.html",                label: "Git Diff & Comparing Branches",  cdn: true },
        { file: "2_4-git-remote-mission.html",                label: "Git Remotes & Push",             cdn: true },
        { file: "2_5-git-fetch-pull-remote-mission.html",     label: "Git Fetch & Pull",               cdn: true },
        { file: "2_6-git-merge-conflict-mission.html",        label: "Remote Merge Conflict",          cdn: true },
        {
          file: "2_7-gitlab-merge-request-simulator-standalone.html",
          label: "GitLab Merge Request (MR/PR)",
          cdn: true,
        },
      ],
    },
  ];

  const root = document.getElementById("nav-root");
  const viewer = document.getElementById("viewer");
  const titleEl = document.getElementById("current-title");
  const openNewTabIcon = document.getElementById("open-new-tab-icon");
  const emptyState = document.getElementById("empty-state");
  const sidebarToggle = document.getElementById("sidebar-toggle");
  const themeToggle = document.getElementById("theme-toggle");

  sidebarToggle.addEventListener("click", () => {
    layout.classList.toggle("sidebar-collapsed");
    const isNowCollapsed = layout.classList.contains("sidebar-collapsed");
    localStorage.setItem("git-sim-sidebar-collapsed", isNowCollapsed);
    sidebarToggle.setAttribute("aria-expanded", !isNowCollapsed);
  });

  themeToggle.addEventListener("click", () => {
    const currentTheme = html.dataset.theme || 'light';
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    html.dataset.theme = newTheme;
    localStorage.setItem('git-sim-theme', newTheme);
    themeToggle.setAttribute('aria-pressed', newTheme === 'dark');
  });

  function selectFile(file, label) {
    emptyState.hidden = true;
    viewer.hidden = false;
    viewer.src = file;
    titleEl.textContent = label;
    openNewTabIcon.href = file;
    openNewTabIcon.style.display = "flex";
    document.querySelectorAll(".nav-link").forEach((a) =>
      a.classList.toggle("active", a.dataset.file === file)
    );
    history.replaceState(null, "", "#" + encodeURIComponent(file));
  }

  // Render nav
  NAV.forEach(({ group, items }) => {
    const h2 = document.createElement("h2");
    h2.className = "nav-group-title";
    h2.textContent = group;
    root.appendChild(h2);

    const ul = document.createElement("ul");
    ul.className = "nav-group-list";
    root.appendChild(ul);

    items.forEach((item) => {
      const li = document.createElement("li");
      li.className = "nav-item";

      const a = document.createElement("a");
      a.href = "#";
      a.className = "nav-link";
      a.dataset.file = item.file;

      const label = document.createElement("span");
      label.className = "nav-label";
      label.textContent = item.label;
      a.appendChild(label);

      if (item.cdn) {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.innerHTML = WIFI_ICON_SVG;
        badge.title = "Needs internet";
        a.appendChild(badge);
      }

      a.addEventListener("click", (e) => {
        e.preventDefault();
        selectFile(item.file, item.label);
      });

      li.appendChild(a);

      if (item.note) {
        const note = document.createElement("span");
        note.className = "nav-note";
        note.textContent = item.note;
        li.appendChild(note);
      }

      ul.appendChild(li);
    });
  });

  // Fill footer badge with the same SVG icon
  const footerBadge = document.querySelector('.sidebar-footer .badge');
  if (footerBadge) {
    footerBadge.innerHTML = WIFI_ICON_SVG;
  }

  // Deep-link support: restore selection from hash on load
  const initial = decodeURIComponent(location.hash.slice(1));
  const match = NAV.flatMap((g) => g.items).find((i) => i.file === initial);
  if (match) {
    selectFile(match.file, match.label);
  }
</script>

</body>
